<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#E6E4DE" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0C0D11" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.__PWA=true</script>
</head>
<body>
<title>Spicciolo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<style>
/* Concept: "il PC di casa, ridisegnato oggi". Fondo color plastica da case anni '90, finestre pulite con barra del titolo,
   un HUD a fosfori per il mese, icone su griglia di pixel. Carattere pixel solo per titoli ed etichette;
   importi sempre in IBM Plex Mono con cifre allineate. */
:root{
  --bg:#E6E4DE; --surface:#FBFAF7; --surface2:#EFEDE7; --fg:#16171B; --muted:#585B63; --line:#D3D0C7; --edge:#16171B; --hard:#16171B;
  --accent:#2F3FE8; --accent-fg:#FFFFFF; --hot:#D42A7E;
  --hud-bg:#0E1315; --hud-fg:#DDFDF1; --hud-dim:#8DC2B2; --hud-acc:#5BEFC2; --hud-tile:rgba(91,239,194,.08); --hud-line:rgba(91,239,194,.22);
  --hud-good:#5BEFC2; --hud-warn:#FFD166; --hud-bad:#FF7A7A;
  --good:#1E7F46; --warn:#9A5D00; --bad:#BF2F26;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948; --s0:#8B8C90;
  --pixel:"Pixelify Sans", "Courier New", monospace;
  --body:"IBM Plex Sans", "Segoe UI", Roboto, system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "Roboto Mono", monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C0D11; --surface:#15171D; --surface2:#1D2028; --fg:#ECEDEF; --muted:#A2A5AF; --line:#2B2F3A; --edge:#3B4050; --hard:#000000;
  --accent:#8D99FF; --accent-fg:#0C0D11; --hot:#FF6CB6;
  --hud-bg:#070A0B; --hud-fg:#DDFDF1; --hud-dim:#8DC2B2; --hud-acc:#5BEFC2; --hud-tile:rgba(91,239,194,.07); --hud-line:rgba(91,239,194,.25);
  --hud-good:#5BEFC2; --hud-warn:#FFD166; --hud-bad:#FF7A7A;
  --good:#4CC38A; --warn:#E9A23B; --bad:#F06A5F;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s0:#7F818A;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0C0D11; --surface:#15171D; --surface2:#1D2028; --fg:#ECEDEF; --muted:#A2A5AF; --line:#2B2F3A; --edge:#3B4050; --hard:#000000;
  --accent:#8D99FF; --accent-fg:#0C0D11; --hot:#FF6CB6;
  --hud-bg:#070A0B; --hud-fg:#DDFDF1; --hud-dim:#8DC2B2; --hud-acc:#5BEFC2; --hud-tile:rgba(91,239,194,.07); --hud-line:rgba(91,239,194,.25);
  --hud-good:#5BEFC2; --hud-warn:#FFD166; --hud-bad:#FF7A7A;
  --good:#4CC38A; --warn:#E9A23B; --bad:#F06A5F;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s0:#7F818A;
  color-scheme:dark }

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:540px;margin:0 auto;padding-inline:16px}
.px{width:20px;height:20px;flex:none;shape-rendering:crispEdges;display:block}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pxfont{font-family:var(--pixel);letter-spacing:.02em}

/* intestazione */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--pixel);font-weight:700;font-size:21px;background:none;border:0;padding:0;color:var(--fg)}
.brand .logo{width:30px;height:30px;display:grid;place-items:center;background:var(--accent);color:var(--accent-fg);border:2px solid var(--edge);box-shadow:2px 2px 0 var(--hard)}
.brand .logo .px{width:18px;height:18px}
.monthnav{display:flex;align-items:center;background:var(--surface);border:1.5px solid var(--edge);border-radius:6px;box-shadow:2px 2px 0 var(--hard)}
.monthnav button{width:36px;height:36px;border:0;background:none;display:grid;place-items:center}
.monthnav button:disabled{opacity:.28;cursor:default}
.monthnav .lbl{min-width:104px;text-align:center;font-family:var(--pixel);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.04em}

main{padding-block:6px 150px;display:flex;flex-direction:column;gap:16px}
.view{display:flex;flex-direction:column;gap:16px}
.view.enter{animation:rise .28s steps(6,end)}
@keyframes rise{from{opacity:.3;transform:translateY(6px)}to{opacity:1;transform:none}}

/* finestre */
.win{background:var(--surface);border:1.5px solid var(--edge);border-radius:8px;box-shadow:3px 3px 0 var(--hard);overflow:hidden}
.tbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border-bottom:1.5px solid var(--edge);background:var(--surface2)}
.tbar h2,.tbar .t{margin:0;font-family:var(--pixel);font-weight:600;font-size:15px;letter-spacing:.03em;text-transform:uppercase;text-wrap:balance;min-width:0}
.tbar .dots{display:flex;gap:4px;flex:none}
.tbar .dots i{width:8px;height:8px;border:1.5px solid var(--edge);display:block}
.tbar .sub{font-size:12px;color:var(--muted);font-family:var(--mono)}
.wbody{padding:14px;display:flex;flex-direction:column;gap:12px}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0;text-decoration:underline;text-underline-offset:3px}

.notice{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1.5px dashed var(--edge);border-radius:8px;padding:10px 12px;font-size:13.5px}
.notice.plain{color:var(--muted);border-color:var(--line)}
.notice.check{border-style:solid;border-color:var(--warn)}
.notice.check b{color:var(--warn)}

/* HUD del mese */
.hud{position:relative;background:var(--hud-bg);color:var(--hud-fg);border:1.5px solid var(--edge);border-radius:10px;box-shadow:3px 3px 0 var(--hard);overflow:hidden;isolation:isolate}
.hud::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
.fx-off .hud::after{display:none}
.hud .hbar{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid var(--hud-line);font-family:var(--pixel);font-size:13px;letter-spacing:.06em;color:var(--hud-dim);text-transform:uppercase}
.hud .hbar b{color:var(--hud-acc);font-weight:600}
.hud .hb{padding:14px;display:flex;flex-direction:column;gap:14px}
.hud .row1{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hud .lab{font-size:12px;color:var(--hud-dim);font-family:var(--pixel);letter-spacing:.06em;text-transform:uppercase}
.hud .big{font-family:var(--mono);font-weight:600;font-size:clamp(32px,10vw,44px);line-height:1;letter-spacing:-.03em;margin-top:6px;color:var(--hud-fg);text-shadow:0 0 18px rgba(91,239,194,.25)}
.fx-off .hud .big{text-shadow:none}
.hud .big small{font-size:.5em;color:var(--hud-dim);margin-left:3px}
.hud .chip{font-family:var(--mono);font-size:12px;padding:3px 7px;border:1px solid var(--hud-line);border-radius:4px;white-space:nowrap}
.hud .chip.up{color:var(--hud-bad);border-color:color-mix(in srgb,var(--hud-bad) 45%,transparent)}
.hud .chip.down{color:var(--hud-good);border-color:color-mix(in srgb,var(--hud-good) 45%,transparent)}
.life{display:flex;flex-direction:column;gap:6px}
.life .lt{display:flex;justify-content:space-between;font-size:12px;color:var(--hud-dim)}
.life .lt b{font-family:var(--mono);color:var(--hud-fg);font-weight:600}
.seg{display:grid;grid-template-columns:repeat(20,1fr);gap:3px}
.seg i{height:12px;background:var(--hud-tile);border:1px solid var(--hud-line)}
.seg i.on{background:var(--hud-good);border-color:var(--hud-good)}
.seg.warn i.on{background:var(--hud-warn);border-color:var(--hud-warn)}
.seg.bad i.on{background:var(--hud-bad);border-color:var(--hud-bad)}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hstats div{border:1px solid var(--hud-line);background:var(--hud-tile);border-radius:6px;padding:8px 9px;min-width:0;display:flex;flex-direction:column;gap:3px}
.hstats .l{font-size:11px;color:var(--hud-dim);line-height:1.25}
.hstats .v{font-family:var(--mono);font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hstats .v.bad{color:var(--hud-bad)} .hstats .v.good{color:var(--hud-good)}
.mix{display:flex;gap:2px;height:6px}
.mix i{display:block;height:100%;min-width:3px}
.glitch{animation:glitch .26s steps(2,end) 1}
@keyframes glitch{0%{text-shadow:2px 0 var(--hot),-2px 0 var(--hud-acc);transform:translateX(1px)}50%{text-shadow:-2px 0 var(--hot),2px 0 var(--hud-acc);transform:translateX(-1px)}100%{text-shadow:none;transform:none}}

/* schede "da sapere" */
.insights{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px 6px;scroll-snap-type:x mandatory}
.insights::-webkit-scrollbar{display:none}
.ins{flex:none;width:min(80%,310px);scroll-snap-align:start;background:var(--surface);border:1.5px solid var(--edge);border-radius:8px;box-shadow:2px 2px 0 var(--hard);padding:11px 12px;display:flex;gap:11px;align-items:flex-start}
.ins .ic{width:34px;height:34px;display:grid;place-items:center;flex:none;border:1.5px solid currentColor;border-radius:6px}
.ins b{display:block;font-size:14px;line-height:1.3}
.ins span{font-size:12.5px;color:var(--muted)}

/* elenco */
.dayhead{display:flex;justify-content:space-between;padding:2px 2px 6px;font-size:12px;color:var(--muted);font-family:var(--pixel);letter-spacing:.05em;text-transform:uppercase}
.rows{background:var(--surface);border:1.5px solid var(--edge);border-radius:8px;box-shadow:2px 2px 0 var(--hard);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;background:none;border:0;text-align:left;position:relative}
.row+.row{border-top:1px solid var(--line)}
.row:active{background:var(--surface2)}
.tile{width:38px;height:38px;display:grid;place-items:center;flex:none;border-radius:6px;border:1.5px solid currentColor}
.row .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.row .cat{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .note{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:600}
.row.upc .tile{border-style:dashed}
.row.upc .amt{color:var(--muted)}
.tag{font-size:10.5px;font-weight:600;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;color:var(--muted);vertical-align:1px;font-family:var(--body)}
.chk{display:flex;gap:8px;align-items:center;margin:2px 0 12px;font-size:14px;color:var(--fg)}.chk input{width:20px;height:20px}
.tag.chk{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.tag.in{color:var(--good);border-color:color-mix(in srgb,var(--good) 50%,transparent)}
.tag.fin{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.empty{text-align:center;color:var(--muted);padding:32px 16px;display:flex;flex-direction:column;gap:6px;align-items:center}
.empty b{color:var(--fg);font-family:var(--pixel);font-weight:600;font-size:18px;letter-spacing:.03em}

/* statistiche */
.donutwrap{display:grid;grid-template-columns:140px 1fr;gap:14px;align-items:center}
@media (max-width:360px){.donutwrap{grid-template-columns:1fr;justify-items:center}}
.donut{width:140px;height:140px;position:relative}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:18;transition:opacity .2s;cursor:pointer}
.donut circle.dim{opacity:.18}
.donut .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none;line-height:1.15;padding:26px}
.donut .c b{font-family:var(--mono);font-size:17px;font-weight:600;display:block}
.donut .c span{font-size:11px;color:var(--muted)}
.legend{display:flex;flex-direction:column;gap:1px;min-width:0;width:100%}
.lg{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center;padding:5px 6px;border-radius:4px;background:none;border:0;text-align:left;width:100%}
.lg.on{background:var(--surface2);outline:1.5px solid var(--edge)}
.lg .n{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lg .p{font-size:12px;color:var(--muted)}
.lg .px{width:16px;height:16px}
.bars{display:flex;flex-direction:column;gap:10px}
.brow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.brow .nm{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;min-width:0}
.brow .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .vv{font-size:12.5px;color:var(--muted)}
.brow .vv b{color:var(--fg)}
.pbar{grid-column:1/-1;display:grid;grid-template-columns:repeat(24,1fr);gap:2px}
.pbar i{height:9px;background:var(--surface2);border:1px solid var(--line)}
.pbar i.on{background:var(--good);border-color:var(--good)}
.pbar.warn i.on{background:var(--warn);border-color:var(--warn)}
.pbar.bad i.on{background:var(--bad);border-color:var(--bad)}
.pbar.neu i.on{background:var(--muted);border-color:var(--muted)}
.state{grid-column:1/-1;font-size:12px;color:var(--muted)}
.state.bad{color:var(--bad);font-weight:600} .state.warn{color:var(--warn);font-weight:600}
.chartbox{position:relative}
.chartbox svg{display:block;width:100%;height:auto}
.tip{position:absolute;top:0;transform:translate(-50%,-100%);background:var(--fg);color:var(--bg);font-family:var(--mono);font-size:11.5px;font-weight:600;padding:5px 8px;border-radius:4px;white-space:nowrap;pointer-events:none}
.keyrow{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.keyrow span{display:flex;align-items:center;gap:6px}
.keyrow i{display:inline-block;width:16px;border-top:2px dashed var(--muted)}
.keyrow i.b{border-top:2px solid var(--warn)}
.mt{width:100%;border-collapse:collapse;font-size:13px}
.mt td{padding:6px 0;border-top:1px solid var(--line);vertical-align:top}
.mt tr:first-child td{border-top:0}
.mt td:last-child{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.ht td{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px;padding:7px 0 7px 6px}.ht td:first-child{text-align:left;font-family:var(--body);padding-left:0}.ht tr:first-child td{color:var(--muted);font-family:var(--body);font-size:11.5px}.ht tr[data-goym]{cursor:pointer}.ht tr.cur td{font-weight:700}.ht .mut{color:var(--muted);font-family:var(--body)}
.mt td.na{color:var(--muted);font-family:var(--body);font-size:12px}
.msg{border-left:3px solid var(--accent);padding:6px 10px;background:var(--surface2);font-size:13.5px}
.msg.bad{border-left-color:var(--bad)} .msg.good{border-left-color:var(--good)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;font-family:var(--pixel)}
.cal button{aspect-ratio:1;max-width:100%;border:1px solid var(--line);border-radius:3px;font-size:11px;font-family:var(--mono);display:grid;place-items:center;background:var(--surface2);color:var(--muted);padding:0}
.cal button.fut{background:none;border-style:dashed;cursor:default}
.cal button.sel{outline:2px solid var(--fg);outline-offset:1px}
.calkey{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.calkey i{width:12px;height:12px;display:inline-block;border:1px solid var(--line)}
ol.top{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
ol.top li{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
ol.top li:first-child{border-top:0}
ol.top .txt{flex:1;min-width:0}
ol.top .d{color:var(--muted);font-size:12px}
ol.top .tile{width:30px;height:30px}
ol.top .tile .px{width:16px;height:16px}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.ach div{border:1.5px solid var(--edge);border-radius:6px;padding:9px;display:flex;gap:8px;align-items:center;background:var(--surface2)}
.ach div.lock{border-style:dashed;border-color:var(--line);color:var(--muted);background:none}
.ach b{display:block;font-size:12.5px;line-height:1.25}
.ach span{font-size:11px;color:var(--muted)}
.ach .px{color:var(--hot)}
.ach div.lock .px{color:var(--muted)}

/* impostazioni */
.list{display:flex;flex-direction:column}
.litem{display:flex;align-items:center;gap:12px;padding:10px 0;background:none;border:0;width:100%;text-align:left}
.litem+.litem{border-top:1px solid var(--line)}
.litem .txt{flex:1;min-width:0}
.litem .txt b{display:block}
.litem .txt span{font-size:12.5px;color:var(--muted)}
.btn{border:1.5px solid var(--edge);background:var(--surface);border-radius:6px;padding:12px 16px;font-weight:600;text-align:center;display:flex;justify-content:center;align-items:center;gap:8px;box-shadow:2px 2px 0 var(--hard);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--hard)}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--bad)}
.btn.danger.arm{background:var(--bad);color:#fff}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.field{display:flex;flex-direction:column;gap:5px}
.field>label,.lab{font-size:12px;color:var(--muted);font-weight:600}
input[type=text],input[type=date],input[type=number],select{background:var(--surface);border:1.5px solid var(--edge);border-radius:6px;padding:11px 12px;min-width:0;width:100%}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.switch input{width:46px;height:26px;appearance:none;-webkit-appearance:none;border:1.5px solid var(--edge);border-radius:4px;background:var(--surface2);position:relative;cursor:pointer;flex:none}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;background:var(--muted);transition:left .12s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:22px;background:var(--accent-fg)}
.colpick{display:flex;gap:8px;flex-wrap:wrap}
.colpick button{width:32px;height:32px;border:1.5px solid var(--edge);border-radius:4px}
.colpick button[aria-pressed="true"]{outline:3px solid var(--fg);outline-offset:2px}

const KWL = {}; Object.keys(KW).forEach(k=>KWL[k]=KW[k].split(/\s+/).filter(Boolean).map(w=>w.replace(/\?$/,"")).map(w=>({w:w.replace(/^[=~]/,""), exact:w[0]==="=", weak:w[0]==="~"})));
const STOP = new Set("di da per il lo la i gli le un una uno al alla allo ai agli alle del dello della dei degli delle e ed in con su tra fra euro eur pagato pagata preso presa comprato comprata acquisto".split(" "));
function norm(s){ return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9&]+/g," ").trim(); }
const tokens = s => norm(s).split(" ").filter(t=>t.length>=2 && !/^\d/.test(t)).filter(t=>!STOP.has(t));
const kwHit = (t,k) => k.exact ? t===k.w : t.startsWith(k.w);
const stem = t => t.slice(0,6);
function near1(a,b){ if(a===b) return true; const la=a.length, lb=b.length; if(Math.abs(la-lb)>1) return false;
  let i=0,j=0,d=0; while(i<la&&j<lb){ if(a[i]===b[j]){i++;j++;continue;} if(++d>1) return false; if(la>lb) i++; else if(lb>la) j++; else {i++;j++;} } return d+(la-i)+(lb-j)<=1; }
const fuzzyHit = (t,k) => t.length>=6 && k.w.length>=6 && (k.exact ? near1(t,k.w) : near1(t.slice(0,k.w.length),k.w) || near1(t.slice(0,k.w.length+1),k.w) || near1(t.slice(0,k.w.length-1),k.w));

function learnIndex(){ if(learned) return learned; learned={}; S.exps.forEach(e=>{ if(!e.note||e.ex||!e.mac) return; const k=e.mac+"."+(e.sub||"");
  new Set(tokens(e.note).map(stem)).forEach(t=>{ const o=learned[t]=learned[t]||{}; o[k]=(o[k]||0)+1; }); }); return learned; }

/* classificazione a due livelli con confidenza: {mac, sub, conf:"alta"|"media", subConf, why, how} oppure null */
function classify(text, amt){
  const tk=tokens(text); if(!tk.length) return null;
  const L=learnIndex(), sub={}, mex={}, why={}, how={};
  const put=(obj,key,v,t,h)=>{ obj[key]=(obj[key]||0)+v; const prev=how[key+"#v"]||0; if(v>=prev){ why[key]=t; how[key]=h; how[key+"#v"]=v; } };
  tk.forEach(t=>{
    const l=L[stem(t)]; if(l) Object.keys(l).forEach(k=>{ const [m,s]=k.split("."); if(!TAXM[m]) return; const v=Math.min(l[k],4)*2.5; if(s) put(sub,k,v,t,"learned"); else put(mex,m,v,t,"learned"); });
    S.macs.forEach(mc=>{
      (mc.words||[]).forEach(w=>{ const n=norm(w); if(n && (t===n || (n.length>=4 && stem(t)===stem(n)))) put(mex,mc.id,4,t,"words"); });
      Object.keys(mc.subWords||{}).forEach(s=>(mc.subWords[s]||[]).forEach(w=>{ const n=norm(w); if(n && (t===n || (n.length>=4 && stem(t)===stem(n)))) put(sub,mc.id+"."+s,4,t,"words"); }));
    });
    let hit=false;
    Object.keys(KWL).forEach(k=>{ const ks=KWL[k].filter(x=>kwHit(t,x)); if(ks.length){ hit=true; put(sub,k,ks.some(x=>!x.weak)?2:1,t,"dict"); } });
    if(!hit) Object.keys(KWL).forEach(k=>{ if(KWL[k].some(x=>!x.weak && fuzzyHit(t,x))) put(sub,k,1.5,t,"fuzzy"); });
  });
  const st=tk.map(stem);
  BIGRAMS.forEach(([a,b,k])=>{ if(st.some(x=>x.startsWith(a)) && st.some(x=>x.startsWith(b))) put(sub,k,4,a+" "+b,"bigram"); });
  if(st.some(x=>TRAVEL.some(w=>x.startsWith(w.slice(0,6))))) Object.keys(TRAVEL_MAP).forEach(k=>{ if(sub[k]){ put(sub,TRAVEL_MAP[k],sub[k]+1,why[k],"travel"); delete sub[k]; } });
  if(amt && amt>1000 && sub["risto.bar"]) sub["risto.bar"]-=1.5;   // al bar si spende poco: oltre 10 € è più probabile altro
  const ms={};
  TAX.forEach(m=>{ let best=0; m.subs.forEach(s=>{ best=Math.max(best, sub[m.id+"."+s[0]]||0); }); const v=best+(mex[m.id]||0); if(v>0) ms[m.id]=v; });
  const mr=Object.keys(ms).sort((a,b)=>ms[b]-ms[a]); if(!mr.length) return null;
  const s1=ms[mr[0]], s2=mr[1]?ms[mr[1]]:0; if(s1<1 || s1===s2) return null;
  const m=mr[0], subs=TAXM[m].subs.map(s=>s[0]).filter(s=>sub[m+"."+s]>0).sort((a,b)=>sub[m+"."+b]-sub[m+"."+a]);
  const winKey = subs[0] ? m+"."+subs[0] : m;
  const strong = ["learned","words","bigram"].indexOf(how[winKey] || how[m])>=0;
  const conf = (s1>=2 && s1>=2*s2) || (strong && s1>s2) ? "alta" : "media";
  let sb=null, subConf=null;
  if(subs.length){ const t1=sub[m+"."+subs[0]], t2=subs[1]?sub[m+"."+subs[1]]:0;
    if(t1>t2){ sb=subs[0]; subConf = (t1>=2*t2 && conf==="alta") ? "alta" : "media"; } }
  const w = why[winKey] || why[m] || tk[0];
  return {mac:m, sub:sb, conf, subConf, why:w, how: how[winKey]||how[m]||"dict"};
}
/* "5 euro di sigarette", "sigarette 5,50", "€12 pranzo" → importo + descrizione */
function parseEntry(text){
  const m=String(text).match(/(?:€\s*)?(\d{1,6}(?:[.,]\d{1,2})?)\s*(?:€|euro|eur\b)?/i);
  if(!m) return {amt:null, note:String(text).trim()};
  const note=(text.slice(0,m.index)+" "+text.slice(m.index+m[0].length)).replace(/\s+/g," ").trim().replace(/^(di|da|per|in)\s+/i,"");
  return {amt:m[1].replace(".",","), note: note? note.charAt(0).toUpperCase()+note.slice(1) : ""};
}

const V3_MAP = {grocery:["alim","supermercato"],tobacco:["pers","tabacco"],clothes:["pers","abbigliamento"],care:["pers",null],food:["risto",null],transport:["auto",null],home:["casa",null],health:["salute",null],fun:["tempo",null],subs:["servizi",null],gifts:["fam","regali"],travel:["viaggi",null],sport:["pers","altre"],pets:["fam","familiari"],phone:["servizi","telefono"],kids:["fam","familiari"],books:["tempo","hobby"],other:[null,null],custom:[null,null]};
/* sottocategoria dedotta dalla nota, solo se il dizionario è netto dentro quella macro-categoria */
function subFromNote(note, mac){
  const tk=tokens(note||""); if(!tk.length || !TAXM[mac]) return null;
  const sc={}; tk.forEach(t=>TAXM[mac].subs.forEach(([s])=>{ const ks=(KWL[mac+"."+s]||[]).filter(x=>kwHit(t,x)); if(ks.length) sc[s]=(sc[s]||0)+(ks.some(x=>!x.weak)?2:1); }));
  const st=tk.map(stem); BIGRAMS.forEach(([a,b,k])=>{ const [m,s]=k.split("."); if(m===mac && st.some(x=>x.startsWith(a)) && st.some(x=>x.startsWith(b))) sc[s]=(sc[s]||0)+4; });
  const r=Object.keys(sc).sort((a,b)=>sc[b]-sc[a]); if(!r.length) return null;
  const t1=sc[r[0]], t2=r[1]?sc[r[1]]:0; return (t1>=2 && t1>=2*t2) ? r[0] : null;
}
function mapCat(c, note){
  let [m,s]=V3_MAP[c.kind]||[null,null];
  if(c.kind==="custom"){ const n=norm(c.name); TAX.forEach(mm=>{ if(norm(mm.name)===n) m=mm.id; mm.subs.forEach(([k,nm])=>{ if(norm(nm)===n){ m=mm.id; s=k; } }); }); }
  if(m && !s) s=subFromNote(note, m);
  return [m,s];
}
/* versione 3 → 4: restituisce i nuovi dati e il riepilogo per l'anteprima, senza toccare l'originale */
function planV4(o3){
  const o=JSON.parse(JSON.stringify(o3)), byId={}; o.cats.forEach(c=>byId[c.id]=c);
  const n=fresh(); n.v=4; n.examples=!!o.examples; n.lastBackup=o.lastBackup||null; n.persisted=!!o.persisted;
  const rep={count:o.exps.length, total:sum(o.exps), full:0, macOnly:0, none:0, budgets:[], recs:(o.recs||[]).length, words:0};
  n.exps=o.exps.map(e=>{ const c=byId[e.cat]||{kind:"other",name:""}; const [m,s]=mapCat(c,e.note);
    if(m&&s) rep.full++; else if(m) rep.macOnly++; else rep.none++;
    const x={id:e.id,amt:e.amt,mac:m,sub:s,date:e.date,note:e.note||"",ts:e.ts}; if(e.rec) x.rec=e.rec; if(e.ex) x.ex=true; return x; });
  n.recs=(o.recs||[]).map(r=>{ const c=byId[r.cat]||{kind:"other",name:""}; const [m,s]=mapCat(c,r.note); const x=Object.assign({},r,{mac:m,sub:s}); delete x.cat; return x; });
  // budget: si sommano mese per mese le categorie che confluiscono nella stessa macro-categoria
  const groups={}; o.cats.forEach(c=>{ const [m]=mapCat(c,""); if(m && (c.budgets||[]).length){ (groups[m]=groups[m]||[]).push(c); } });
  const bOf=(c,ym)=>{ let a=0; (c.budgets||[]).forEach(b=>{ if(b.from<=ym) a=b.amt; }); return a; };
  Object.keys(groups).forEach(m=>{ const cs=groups[m], froms=[...new Set(cs.flatMap(c=>c.budgets.map(b=>b.from)))].sort();
    const mm=n.macs.find(x=>x.id===m); let prev=null;
    froms.forEach(f=>{ const v=cs.reduce((t,c)=>t+bOf(c,f),0); if(v!==prev){ mm.budgets.push({from:f,amt:v,ex:cs.every(c=>c.budgets.every(b=>b.ex))||undefined}); prev=v; } });
    rep.budgets.push({m, names:cs.map(c=>c.name), amt:bOf({budgets:mm.budgets},ymOf(today()))}); });
  // parole chiave dell'utente: alla sottocategoria certa, altrimenti alla macro-categoria
  o.cats.forEach(c=>{ if(!(c.words||[]).length) return; const [m,s]=mapCat(c,""); if(!m) return; const mm=n.macs.find(x=>x.id===m);
    if(s){ mm.subWords[s]=(mm.subWords[s]||[]).concat(c.words); } else mm.words=mm.words.concat(c.words); rep.words+=c.words.length; });
  rep.after=n.exps.length; rep.afterTotal=sum(n.exps);
  const n5=toV5(n); rep.global=budgetOf({budgets:n5.budget},ymOf(today()));
  return {data:n5, rep};
}
/* versione 4 → 5: il budget diventa unico (somma mese per mese dei budget per categoria), arrivano le entrate */
function toV5(o){
  if(o.v>=5) return o;
  o.ins=o.ins||[];
  const ms=(o.macs||[]).filter(m=>m.id!=="fin" && (m.budgets||[]).length), froms=[...new Set(ms.flatMap(m=>m.budgets.map(b=>b.from)))].sort();
  const bOf=(m,ym)=>{ let a=0; (m.budgets||[]).forEach(b=>{ if(b.from<=ym) a=b.amt; }); return a; };
  let prev=null; o.budget=o.budget||[];
  froms.forEach(f=>{ const v=ms.reduce((t,m)=>t+bOf(m,f),0); if(v!==prev){ o.budget.push({from:f,amt:v,ex:ms.every(m=>m.budgets.every(b=>b.ex))||undefined}); prev=v; } });
  (o.macs||[]).forEach(m=>{ delete m.budgets; });
  o.v=5; return o;

const metOrder = keys => MET.filter(x=>keys.includes(x.k)).map(x=>x.k);
const mapKeys = (keys,m) => { const out=[]; metOrder(keys).forEach(k=>{ const kk=(!m.isCur && PAST_MAP[k]) || k; if(!out.includes(kk)) out.push(kk); }); return out; };
function metVal(k,m,pc){
  // regola: se manca un dato (budget, stipendio, entrate) vale 0 e la voce restituisce comunque un valore
  const cur=m.isCur, tb=m.tb||0, inAll=m.inTot+(cur?m.upInTot:0), sg=v=>v>=0?"good":"bad";
  const E=(l,v,cls,cents,pre)=>({l, v, cls, full:(pre||"")+(cents?euro(v):euro0(v)), short:(pre||"")+euro0(v)}), NA=(l,why)=>({l, na:why});
  switch(k){
    case "entrate":  return Object.assign(E("Entrate",inAll,"good",true,"+"), {subs: cur&&m.upInTot? [["di cui attese","+"+euro0(m.upInTot)]] : null});
    case "spese":    return E("Spese",m.tot,"",true);
    case "budget":   return E("Budget",tb,"",false);
    case "saldo":    return E("Saldo",tb-m.tot,sg(tb-m.tot),true);
    case "saldoPrev":return E("Saldo previsto",tb-m.proj,sg(tb-m.proj),false);
    case "quota":    return E("Quota di risparmio",inAll-tb,sg(inAll-tb),false);
    case "spesePrev":return Object.assign(E("Spese previste",m.proj,tb&&m.proj>tb?"bad":"",false), {subs:[["già fatte",euro0(m.tot)],["ricorrenze in arrivo",euro0(m.upTot)],["stima per i "+(m.dim-m.dom)+" giorni restanti ("+euro0(m.pace)+"/giorno)",euro0(m.est)]]});
    case "rispPrev": return E("Risparmio previsto",inAll-m.proj,sg(inAll-m.proj),false);
    case "rispMese": return E(cur?"Risparmio finora":"Risparmio del mese",m.saving,sg(m.saving),true);
    case "tasso":    return m.rate===null? NA("Tasso di risparmio","non calcolabile, entrate a 0") : {l:"Tasso di risparmio", cls:sg(m.rate), full:Math.round(m.rate*100)+"%", short:Math.round(m.rate*100)+"%"};
    case "accant":   return E(pc && pc.waiting && cur?"Accantonato fino al mese scorso":"Accantonato",pc?pc.pot:0,sg(pc?pc.pot:0),false);
    case "media":    return E("Media al giorno",Math.round(m.avg),"",true);
    case "invest":   return E("Investimenti",m.inv,"",true);
  }
  return NA(k,"");
}

  return h+'</div></section>';
}

function download(name,text,type){
  try{ const b=new Blob([text],{type:type+";charset=utf-8"}), u=URL.createObjectURL(b), a=document.createElement("a");

  catch(e){ toast("Download non riuscito"); }
}

  h+='<div class="field"><label for="rNote">Descrizione</label><input type="text" id="rNote" maxlength="80" value="'+esc(Rr.note)+'"></div>';
  h+='<div class="field"><label for="rAmt">Importo €</label><input type="text" inputmode="decimal" id="rAmt" value="'+esc(Rr.amt)+'"></div>';
  if(inc) h+='<div class="field"><label for="rKind">Tipo di entrata</label><select id="rKind">'+Object.keys(INK).map(k=>'<option value="'+k+'"'+(k===Rr.kind?" selected":"")+'>'+esc(INK[k])+'</option>').join("")+'</select></div>';
  else h+='<div class="btns"><div class="field"><label for="rMac">Categoria</label><select id="rMac"><option value="">Da verificare</option>'+TAX.map(t=>'<option value="'+t.id+'"'+(t.id===Rr.mac?" selected":"")+'>'+esc(t.name)+'</option>').join("")+'</select></div><div class="field"><label for="rSub">Sottocategoria</label><select id="rSub"><option value="">Da verificare</option>'+(Rr.mac?TAXM[Rr.mac].subs.map(([k,n])=>'<option value="'+k+'"'+(k===Rr.sub?" selected":"")+'>'+esc(n)+'</option>').join(""):"")+'</select></div></div>';
  h+='<div class="strip" role="group" aria-label="Frequenza">'+Object.keys(FREQ).map(f=>'<button class="chip" data-f="'+f+'" aria-pressed="'+(Rr.freq===f)+'">'+FREQ[f].replace("Ogni ","")+'</button>').join("")+'</div>';
  h+='<p class="hint">Le modifiche valgono per le prossime volte; le spese già registrate restano come sono.</p><button class="btn primary" id="rSave">Salva modifiche</button>';
  if(recActive(r)) h+='<button class="btn" id="rStop">Interrompi da oggi (tieni lo storico)</button>';
  h+='<button class="btn danger'+(Rr.arm?" arm":"")+'" id="rDel">'+(Rr.arm?"Tocca ancora: elimina anche le "+past.length+" spese":"Elimina ricorrenza e le sue spese")+'</button></div>';
  const sh=$("sheet"); sh.innerHTML=h; sh.classList.remove("typing");
  const keep=()=>{ Rr.note=$("rNote").value; Rr.amt=$("rAmt").value; if(inc) Rr.kind=$("rKind").value; else { Rr.mac=$("rMac").value; Rr.sub=$("rSub").value; } };
  $("shClose").onclick=closeSheet;
  if(!inc) $("rMac").onchange=()=>{ keep(); Rr.sub=""; drawRecSheet(); };
  sh.querySelectorAll("[data-f]").forEach(b=>{ b.onclick=()=>{ keep(); Rr.freq=b.getAttribute("data-f"); drawRecSheet(); }; });
  $("rSave").onclick=()=>{ keep(); const c=cents(String(Rr.amt).replace(".",",")); if(!c){ toast("Inserisci un importo"); return; }
    if(Rr.freq!==r.freq) r.start = nextOcc(r) || today();
    r.amt=c; if(inc) r.kind=Rr.kind; else { r.mac=Rr.mac||null; r.sub=Rr.sub||null; } r.note=Rr.note.trim(); r.freq=Rr.freq; save(); closeSheet(); render(); toast("Ricorrenza aggiornata"); };
  const st=$("rStop"); if(st) st.onclick=()=>{ r.end=today(); save(); closeSheet(); render(); toast("Ricorrenza interrotta: le spese passate restano"); };
  $("rDel").onclick=()=>{ if(!Rr.arm){ keep(); Rr.arm=true; drawRecSheet(); return; } if(inc) S.ins=S.ins.filter(e=>e.rec!==r.id); else S.exps=S.exps.filter(e=>e.rec!==r.id); S.recs=S.recs.filter(x=>x.id!==r.id); save(); closeSheet(); render(); toast("Ricorrenza eliminata"); };
}

/* elenco delle spese da verificare */
function openCheckSheet(){
  const list=S.exps.filter(toCheck).sort((a,b)=>a.date<b.date?1:-1);
  let h=sheetHead("Da verificare · "+list.length)+'<div class="sb"><p class="hint">Spese senza categoria o sottocategoria certa. Toccane una per sistemarla: ogni scelta insegna qualcosa all\'app.</p>';
  h+= list.length ? '<div class="rows">'+list.map(rowHTML).join("")+'</div>' : '<div class="empty"><b>TUTTO IN ORDINE</b></div>';
  h+='</div>'; const sh=$("sheet"); sh.innerHTML=h; sh.classList.remove("typing"); showSheet();
  $("shClose").onclick=closeSheet;
  sh.querySelectorAll(".row[data-id]").forEach(b=>{ b.onclick=()=>openSheet(b.getAttribute("data-id"),{noFocus:true}); });
}

/* ---------- anteprima della migrazione 3 → 4 ---------- */
function showMigration(raw, plan){
  const r=plan.rep, ok = r.count===r.after && r.total===r.afterTotal;
  let h='<section class="win"><div class="tbar"><span class="t">Nuove categorie</span><span class="dots"><i></i><i></i><i></i></span></div><div class="wbody">';
  h+='<p>Spicciolo passa alla tassonomia nuova: <b>11 macro-categorie e 48 sottocategorie</b>. Ecco cosa succede ai tuoi dati prima di applicare.</p>';
  h+='<table class="mt"><tr><td>Spese convertite con categoria e sottocategoria</td><td>'+r.full+'</td></tr><tr><td>Solo macro-categoria: sottocategoria da verificare</td><td>'+r.macOnly+'</td></tr><tr><td>Categoria da verificare</td><td>'+r.none+'</td></tr><tr><td>Spese ricorrenti rimappate</td><td>'+r.recs+'</td></tr><tr><td>Parole chiave trasferite</td><td>'+r.words+'</td></tr></table>';
  if(r.budgets.length) h+='<p class="hint">Il budget diventa unico: somma dei budget per categoria, mese per mese. Da questo mese: <b>'+euro0(r.global||0)+'</b>.</p>';
  h+='<div class="msg '+(ok?"good":"bad")+'"><b>Controllo:</b> '+r.count+' spese per '+euro(r.total)+' prima, '+r.after+' per '+euro(r.afterTotal)+' dopo. '+(ok?"Nessuna perdita.":"Qualcosa non torna: non applicare e scrivimi.")+'</div>';
  h+='<p class="hint">Prima di applicare viene salvata una copia completa dei dati attuali. Per 30 giorni puoi tornare indietro da Opzioni.</p>';
  h+='<button class="btn primary" id="migOk"'+(ok?"":" disabled")+'>Applica</button><button class="btn" id="migBk">Scarica prima il backup</button></div></section>';
  const el=$("mig"); el.innerHTML=h; el.hidden=false;
  $("migBk").onclick=()=>download("spicciolo-backup-v3-"+today()+".json", JSON.stringify(raw,null,1), "application/json");
  $("migOk").onclick=()=>{ try{ localStorage.setItem(BAK, JSON.stringify({at:Date.now(),data:raw})); }catch(e){ toast("Non riesco a salvare la copia: migrazione annullata"); return; }
    S=plan.data; S.migratedAt=Date.now(); genRecs(); save(); el.hidden=true; render(); toast("Fatto: "+r.full+" spese complete, "+(r.macOnly+r.none)+" da verificare"); };
}

/* ---------- segreto: schermata di avvio ---------- */
function boot(){
  const el=$("boot"), n=S.exps.filter(e=>!e.ex).length, kb=(JSON.stringify(S).length/1024).toFixed(1);
  el.innerHTML='<div class="t">SPICCIOLO/98</div><div>BIOS spese v4.0 · (c) tu, '+new Date().getFullYear()+'</div><div>Controllo memoria ... '+kb+' KB OK</div><div>Spese trovate ......... '+n+'</div><div>Categorie ............. 11 / 48</div><div>Monete sotto il divano  ???</div><div>Segreti trovati ....... '+EGGS.filter(e=>(S.eggs||{})[e.id]).length+' / '+EGGS.length+'</div><div style="margin-top:14px">Premi un tasto per continuare<span class="blink">_</span></div>';
  el.hidden=false; haptic([20,60,20]); el.onclick=()=>{ el.hidden=true; };
}

/* ---------- navigazione ---------- */
function setTab(t){ ui.tab=t; armed=null; document.querySelectorAll(".dock .tab").forEach(b=>b.setAttribute("aria-selected", b.getAttribute("data-tab")===t)); render(true); window.scrollTo(0,0); }
function render(anim){
  renderNotices();
  ["list","stats","settings"].forEach(t=>{ const v=$("v-"+t); v.hidden = ui.tab!==t; v.classList.remove("enter"); });
  $("monthnav").style.visibility = ui.tab==="settings" ? "hidden" : "visible";
  $("monthLbl").textContent = monthName(ui.ym,{month:"short",year:"numeric"});
  $("nextM").disabled = ui.ym >= ymOf(today());
  if(ui.tab==="list") renderList(); else if(ui.tab==="stats") renderStats(); else renderSettings();
  if(anim && fxOn()){ const v=$("v-"+ui.tab); void v.offsetWidth; v.classList.add("enter"); }
}
function goMonth(k){ const n=ymAdd(ui.ym,k); if(n>ymOf(today())) return; ui.ym=n; ui.bar=null; ui.day=null; haptic(6); render(true); }
document.querySelectorAll("[data-px]").forEach(el=>{ el.outerHTML=px(el.getAttribute("data-px")); });
$("logoIco").innerHTML=px("coin");
$("prevM").onclick=()=>goMonth(-1);
$("nextM").onclick=()=>goMonth(1);
document.querySelectorAll(".dock .tab").forEach(b=>{ b.onclick=()=>{ haptic(6); setTab(b.getAttribute("data-tab")); }; });
$("fab").onclick=()=>{ haptic(8); openSheet(null); };
$("scrim").addEventListener("click",function(e){ if(e.target===this) closeSheet(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !$("egg").hidden){ $("egg").hidden=true; return; } if(!F){ if(e.key==="Escape" && (K||Rr||!$("scrim").hidden)) closeSheet(); return; } if(e.key==="Escape") closeSheet(); else if(document.activeElement && /INPUT|SELECT/.test(document.activeElement.tagName)) return; else if(/^[0-9]$/.test(e.key)) key(e.key); else if(e.key===","||e.key===".") key(","); else if(e.key==="Backspace") key("⌫"); else if(e.key==="Enter") saveSheet(); });
let sx=null; document.addEventListener("touchstart",e=>{ const h=e.target.closest&&e.target.closest(".hud"); sx=h?e.touches[0].clientX:null; },{passive:true});
document.addEventListener("touchend",e=>{ if(sx===null) return; const dx=e.changedTouches[0].clientX-sx; sx=null; if(Math.abs(dx)>60) goMonth(dx<0?1:-1); },{passive:true});
let lp=null; const brand=$("brand");
brand.addEventListener("pointerdown",()=>{ lp=setTimeout(boot,800); }); ["pointerup","pointerleave","pointercancel"].forEach(ev=>brand.addEventListener(ev,()=>clearTimeout(lp)));
brand.addEventListener("contextmenu",e=>e.preventDefault());
let taps=[]; brand.addEventListener("click",()=>{ const t=Date.now(); taps=taps.filter(x=>t-x<3000); taps.push(t); if(taps.length>=7){ taps=[]; if(!unlockEgg("spicci")) showEgg("spicci",false); } });
function kbFit(){ const vv=window.visualViewport; if(!vv) return; const h=Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop)); document.documentElement.style.setProperty("--kb", (h>60?h:0)+"px"); }
if(window.visualViewport){ visualViewport.addEventListener("resize",kbFit); visualViewport.addEventListener("scroll",kbFit); }

/* ---------- avvio ---------- */
(function start(){
  const raw=loadRaw();
  if(!raw){ S=fresh(); seedExamples(); save(); }
  else if(raw.macs){ S=toV5(Object.assign(fresh(), raw, {v:raw.v||4})); genRecs(); save(); }
  else { const o3=toV3(JSON.parse(JSON.stringify(raw)));
    if(o3.examples && !o3.exps.some(e=>!e.ex)){ S=fresh(); seedExamples(); save(); }        // solo esempi: si riparte dagli esempi nuovi
    else { const plan=planV4(o3); S=plan.data; applyFx(); render(); showMigration(raw, plan); return; } }
  applyFx(); render(); setTimeout(checkEggs,700);
  if(navigator.storage && navigator.storage.persisted){ navigator.storage.persisted().then(p=>{ if(p!==S.persisted){ S.persisted=p; save(); } }).catch(()=>{}); }
})();
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && S && $("mig").hidden){ if(genRecs()){ save(); render(); } checkEggs(); } });
if(PWA && "serviceWorker" in navigator){ try{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){} }
window.__spicciolo={ get S(){return S;}, metVal, mapKeys, V, EGGS, unlockEgg, checkEggs, spriteSVG, potCtx, set(o){ S=o; render(); }, classify, parseEntry, occurrences, genRecs, planV4, toV3, analyze, patternOf, natOf, budgetOf, setBudget, TAX, PX, decompText, monthCtx, subFromNote };

})();
</script>
