<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1E1F25">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>:root{color-scheme:dark;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.__PWA=true</script>
</head>
<body>
<title>Spicciolo</title>
<style>
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-mono-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/ibm-plex-mono-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/ibm-plex-sans-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Pixelify Sans';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/pixelify-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Pixelify Sans';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/pixelify-sans-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Pixelify Sans';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/pixelify-sans-latin-700-normal.woff2) format('woff2')}
</style>
<style>
/* Concept: "il PC di casa, ridisegnato oggi". Fondo color plastica da case anni '90, finestre pulite con barra del titolo,
   un HUD a fosfori per il mese, icone su griglia di pixel. Carattere pixel solo per titoli ed etichette;
   importi sempre in IBM Plex Mono con cifre allineate. */
:root{
  /* antracite e viola (mockup del 12/10/2026). L'HUD a fosfori resta com'era. Un solo tema scuro. */
  --bg:#1E1F25; --surface:#26272F; --surface2:#2C2D36; --fg:#F1F1F4; --muted:#A4A6B3; --line:#3A3B47; --edge:#3A3B47; --hard:#0E0E12; --field:#6E7080;
  --accent:#6C5CE7; --accent-fg:#FFFFFF; --link:#A29BFE; --hot:#F2C230;
  --hud-bg:#070A0B; --hud-fg:#DDFDF1; --hud-dim:#8DC2B2; --hud-acc:#5BEFC2; --hud-tile:rgba(91,239,194,.07); --hud-line:rgba(91,239,194,.25);
  --hud-good:#5BEFC2; --hud-warn:#FFD166; --hud-bad:#FF7A7A;
  --good:#4FD39A; --warn:#F2B04C; --bad:#FF7B7B;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s0:#7F818A;
  --pixel:"Pixelify Sans", "Courier New", monospace;
  --body:"IBM Plex Sans", "Segoe UI", Roboto, system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "Roboto Mono", monospace;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:540px;margin:0 auto;padding-inline:16px}
.px{width:20px;height:20px;flex:none;shape-rendering:crispEdges;display:block}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pxfont{font-family:var(--pixel);letter-spacing:.02em}

/* intestazione */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--pixel);font-weight:700;font-size:21px;background:none;border:0;padding:0;color:var(--fg)}
.brand .logo{width:30px;height:30px;display:grid;place-items:center;background:var(--accent);color:var(--accent-fg);border:2px solid var(--edge);box-shadow:2px 2px 0 var(--hard)}
.brand .logo .px{width:18px;height:18px}
.monthnav{display:flex;align-items:center;background:var(--surface);border:1.5px solid var(--field);border-radius:6px;box-shadow:2px 2px 0 var(--hard)}
.monthnav button{width:36px;height:36px;border:0;background:none;display:grid;place-items:center}
.monthnav button:disabled{opacity:.28;cursor:default}
.monthnav .lbl{min-width:104px;text-align:center;font-family:var(--pixel);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.04em}

main{padding-block:6px 150px;display:flex;flex-direction:column;gap:16px}
.view{display:flex;flex-direction:column;gap:16px}
.view.enter{animation:rise .28s steps(6,end)}
@keyframes rise{from{opacity:.3;transform:translateY(6px)}to{opacity:1;transform:none}}

/* finestre */
.win{background:var(--surface);border:1.5px solid var(--edge);border-radius:8px;box-shadow:3px 3px 0 var(--hard);overflow:hidden}
.tbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border-bottom:1.5px solid var(--edge);background:var(--surface2)}
.tbar h2,.tbar .t{margin:0;font-family:var(--pixel);font-weight:600;font-size:15px;letter-spacing:.03em;text-transform:uppercase;text-wrap:balance;min-width:0}
.tbar .dots{display:flex;gap:4px;flex:none}
.tbar .dots i{width:8px;height:8px;border:1.5px solid var(--edge);display:block}
.tbar .sub{font-size:12px;color:var(--muted);font-family:var(--mono)}
.wbody{padding:14px;display:flex;flex-direction:column;gap:12px}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.linkbtn{background:none;border:0;color:var(--link);font-weight:600;padding:4px 0;text-decoration:underline;text-underline-offset:3px}

.notice{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1.5px dashed var(--edge);border-radius:8px;padding:10px 12px;font-size:13.5px}
.notice.plain{color:var(--muted);border-color:var(--line)}
.notice.check{border-style:solid;border-color:var(--warn)}
.notice.check b{color:var(--warn)}

/* HUD del mese */
.hud{position:relative;background:var(--hud-bg);color:var(--hud-fg);border:1.5px solid var(--edge);border-radius:10px;box-shadow:3px 3px 0 var(--hard);overflow:hidden;isolation:isolate}
.hud::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
.fx-off .hud::after{display:none}
.hud .hbar{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid var(--hud-line);font-family:var(--pixel);font-size:13px;letter-spacing:.06em;color:var(--hud-dim);text-transform:uppercase}
.hud .hbar b{color:var(--hud-acc);font-weight:600}
.hud .hb{padding:14px;display:flex;flex-direction:column;gap:14px}
.hud .row1{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hud .lab{font-size:12px;color:var(--hud-dim);font-family:var(--pixel);letter-spacing:.06em;text-transform:uppercase}
.hud .big{font-family:var(--mono);font-weight:600;font-size:clamp(32px,10vw,44px);line-height:1;letter-spacing:-.03em;margin-top:6px;color:var(--hud-fg);text-shadow:0 0 18px rgba(91,239,194,.25)}
.fx-off .hud .big{text-shadow:none}
.hud .big small{font-size:.5em;color:var(--hud-dim);margin-left:3px}
.hud .chip{font-family:var(--mono);font-size:12px;padding:3px 7px;border:1px solid var(--hud-line);border-radius:4px;white-space:nowrap}
.hud .chip.up{color:var(--hud-warn);border-color:color-mix(in srgb,var(--hud-warn) 45%,transparent)}
.hud .chip.down{color:var(--hud-good);border-color:color-mix(in srgb,var(--hud-good) 45%,transparent)}
.life{display:flex;flex-direction:column;gap:6px;width:100%;background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit}
.life.nob{border:1px dashed var(--hud-line);border-radius:6px;padding:12px 10px;min-height:44px}
.life .lt b.w{color:var(--hud-warn)} .life .lt b.r{color:var(--hud-bad)}
.life .lt{display:flex;justify-content:space-between;font-size:12px;color:var(--hud-dim)}
.life .lt b{font-family:var(--mono);color:var(--hud-fg);font-weight:600}
.seg{display:grid;grid-template-columns:repeat(20,1fr);gap:3px}
.seg i{display:block}
.seg i{height:12px;background:var(--hud-tile);border:1px solid var(--hud-line)}
.seg i.on{background:var(--hud-good);border-color:var(--hud-good)}
.seg.warn i.on{background:var(--hud-warn);border-color:var(--hud-warn)}
.seg.bad i.on{background:var(--hud-bad);border-color:var(--hud-bad)}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hstats div{border:1px solid var(--hud-line);background:var(--hud-tile);border-radius:6px;padding:8px 9px;min-width:0;display:flex;flex-direction:column;gap:3px}
.hstats .l{font-size:11px;color:var(--hud-dim);line-height:1.25}
.hstats .v{font-family:var(--mono);font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hstats .v.bad{color:var(--hud-bad)} .hstats .v.good{color:var(--hud-good)} .hstats .v.warn{color:var(--hud-warn)}
.hstats .hst{border:1px solid var(--hud-line);background:var(--hud-tile);border-radius:6px;padding:8px 9px;min-width:0;display:flex;flex-direction:column;gap:3px;text-align:left;color:inherit;font:inherit;min-height:44px}
.hstats .hst .na{text-decoration:underline;text-underline-offset:2px}
.mix{display:flex;gap:2px;height:6px}
.mix i{display:block;height:100%;min-width:3px}
.glitch{animation:glitch .26s steps(2,end) 1}
@keyframes glitch{0%{text-shadow:2px 0 var(--hot),-2px 0 var(--hud-acc);transform:translateX(1px)}50%{text-shadow:-2px 0 var(--hot),2px 0 var(--hud-acc);transform:translateX(-1px)}100%{text-shadow:none;transform:none}}

/* da sapere: elenco in Analisi, un suggerimento al giorno sulla Home */
.inslist{display:flex;flex-direction:column}
.inslist .ins{display:flex;gap:11px;align-items:flex-start;padding:9px 0;width:auto;flex:initial;background:none;border:0;border-top:1px solid var(--line);border-radius:0;box-shadow:none}
.inslist .ins:first-child{border-top:0;padding-top:0}
.tipcard{display:flex;align-items:stretch;background:var(--surface);border:1.5px solid var(--edge);border-radius:8px;box-shadow:2px 2px 0 var(--hard)}
.tipbody{flex:1;min-width:0;display:flex;gap:11px;align-items:flex-start;text-align:left;background:none;border:0;padding:11px 4px 11px 12px;color:inherit}
.tipbody .tt{display:flex;flex-direction:column;gap:2px;min-width:0}
.tipbody b{font-size:14px;line-height:1.3}
.tipmore{font-size:13px;line-height:1.4}
.tipx{width:44px;flex:none;background:none;border:0;color:var(--muted);display:grid;place-items:center}
.ic{width:34px;height:34px;display:grid;place-items:center;flex:none;border:1.5px solid currentColor;border-radius:6px}
/* schede "da sapere" (vecchio carosello) */
.insights{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px 6px;scroll-snap-type:x mandatory}
.insights::-webkit-scrollbar{display:none}
.ins{flex:none;width:min(80%,310px);scroll-snap-align:start;background:var(--surface);border:1.5px solid var(--edge);border-radius:8px;box-shadow:2px 2px 0 var(--hard);padding:11px 12px;display:flex;gap:11px;align-items:flex-start}
.ins .ic{width:34px;height:34px;display:grid;place-items:center;flex:none;border:1.5px solid currentColor;border-radius:6px}
.ins b{display:block;font-size:14px;line-height:1.3}
.ins span{font-size:12.5px;color:var(--muted)}

/* elenco */
.dayhead{display:flex;justify-content:space-between;padding:2px 2px 6px;font-size:12px;color:var(--muted);font-family:var(--pixel);letter-spacing:.05em;text-transform:uppercase}
.rows{background:var(--surface);border:1.5px solid var(--edge);border-radius:8px;box-shadow:2px 2px 0 var(--hard);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;background:none;border:0;text-align:left;position:relative}
.row+.row{border-top:1px solid var(--line)}
.row:active{background:var(--surface2)}
.tile{width:38px;height:38px;display:grid;place-items:center;flex:none;border-radius:6px;border:1.5px solid currentColor}
.row .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.row .cat{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .note{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:600}
.row.upc .tile{border-style:dashed}
.row.upc .amt{color:var(--muted)}
.tag{font-size:10.5px;font-weight:600;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;color:var(--muted);vertical-align:1px;font-family:var(--body)}
.chk{display:flex;gap:8px;align-items:center;margin:2px 0 12px;font-size:14px;color:var(--fg)}.chk input{width:20px;height:20px}
.tag.chk{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.tag.in{color:var(--good);border-color:color-mix(in srgb,var(--good) 50%,transparent)}
.tag.fin{color:var(--link);border-color:color-mix(in srgb,var(--link) 50%,transparent)}
.empty{text-align:center;color:var(--muted);padding:32px 16px;display:flex;flex-direction:column;gap:6px;align-items:center}
.empty b{color:var(--fg);font-family:var(--pixel);font-weight:600;font-size:18px;letter-spacing:.03em}

/* statistiche */
.donutwrap{display:grid;grid-template-columns:140px 1fr;gap:14px;align-items:center}
@media (max-width:360px){.donutwrap{grid-template-columns:1fr;justify-items:center}}
.donut{width:140px;height:140px;position:relative}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:18;transition:opacity .2s;cursor:pointer}
.donut circle.dim{opacity:.18}
.donut .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none;line-height:1.15;padding:26px}
.donut .c b{font-family:var(--mono);font-size:17px;font-weight:600;display:block}
.donut .c span{font-size:11px;color:var(--muted)}
.legend{display:flex;flex-direction:column;gap:1px;min-width:0;width:100%}
.lg{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center;padding:5px 6px;border-radius:4px;background:none;border:0;text-align:left;width:100%}
.lg.on{background:var(--surface2);outline:1.5px solid var(--edge)}
.lg .n{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lg .p{font-size:12px;color:var(--muted)}
.lg .px{width:16px;height:16px}
.bars{display:flex;flex-direction:column;gap:10px}
.brow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.brow .nm{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;min-width:0}
.brow .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .vv{font-size:12.5px;color:var(--muted)}
.brow .vv b{color:var(--fg)}
.pbar{grid-column:1/-1;display:grid;grid-template-columns:repeat(24,1fr);gap:2px}
.pbar i{height:9px;background:var(--surface2);border:1px solid var(--line)}
.pbar i.on{background:var(--good);border-color:var(--good)}
.pbar.warn i.on{background:var(--warn);border-color:var(--warn)}
.pbar.bad i.on{background:var(--bad);border-color:var(--bad)}
.pbar.neu i.on{background:var(--muted);border-color:var(--muted)}
.state{grid-column:1/-1;font-size:12px;color:var(--muted)}
.state.bad{color:var(--bad);font-weight:600} .state.warn{color:var(--warn);font-weight:600}
.chartbox{position:relative}
.chartbox svg{display:block;width:100%;height:auto}
.tip{position:absolute;top:0;transform:translate(-50%,-100%);background:var(--fg);color:var(--bg);font-family:var(--mono);font-size:11.5px;font-weight:600;padding:5px 8px;border-radius:4px;white-space:nowrap;pointer-events:none}
.keyrow{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.keyrow span{display:flex;align-items:center;gap:6px}
.keyrow i{display:inline-block;width:16px;border-top:2px dashed var(--muted)}
.keyrow i.b{border-top:2px solid var(--warn)}
.mt{width:100%;border-collapse:collapse;font-size:13px}
.mt td{padding:6px 0;border-top:1px solid var(--line);vertical-align:top}
.mt tr:first-child td{border-top:0}
.mt td:last-child{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.ht td{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px;padding:7px 0 7px 6px}.ht td:first-child{text-align:left;font-family:var(--body);padding-left:0}.ht tr:first-child td{color:var(--muted);font-family:var(--body);font-size:11.5px}.ht tr[data-goym]{cursor:pointer}.ht tr.cur td{font-weight:700}.ht .mut{color:var(--muted);font-family:var(--body)}
.mt td.na{color:var(--muted);font-family:var(--body);font-size:12px}
.msg{border-left:3px solid var(--accent);padding:6px 10px;background:var(--surface2);font-size:13.5px}
.msg.bad{border-left-color:var(--bad)} .msg.good{border-left-color:var(--good)} .msg.warn{border-left-color:var(--warn)}
.waitbox{display:flex;flex-direction:column;gap:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;font-family:var(--pixel)}
.cal button{aspect-ratio:1;max-width:100%;border:1px solid var(--line);border-radius:3px;font-size:11px;font-family:var(--mono);display:grid;place-items:center;background:var(--surface2);color:var(--muted);padding:0}
.cal button.fut{background:none;border-style:dashed;cursor:default}
.cal button.sel{outline:2px solid var(--fg);outline-offset:1px}
.calkey{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.calkey i{width:12px;height:12px;display:inline-block;border:1px solid var(--line)}
ol.top{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
ol.top li{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
ol.top li:first-child{border-top:0}
ol.top .txt{flex:1;min-width:0}
ol.top .d{color:var(--muted);font-size:12px}
ol.top .tile{width:30px;height:30px}
ol.top .tile .px{width:16px;height:16px}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.ach div{border:1.5px solid var(--edge);border-radius:6px;padding:9px;display:flex;gap:8px;align-items:center;background:var(--surface2)}
.ach div.lock{border-style:dashed;border-color:var(--line);color:var(--muted);background:none}
.ach b{display:block;font-size:12.5px;line-height:1.25}
.ach span{font-size:11px;color:var(--muted)}
.ach .px{color:var(--hot)}
.ach div.lock .px{color:var(--muted)}

/* impostazioni */
.list{display:flex;flex-direction:column}
.litem{display:flex;align-items:center;gap:12px;padding:10px 0;background:none;border:0;width:100%;text-align:left}
.litem+.litem{border-top:1px solid var(--line)}
.litem .txt{flex:1;min-width:0}
.litem .txt b{display:block}
.litem .txt span{font-size:12.5px;color:var(--muted)}
.btn{border:1.5px solid var(--field);background:var(--surface);border-radius:6px;padding:12px 16px;font-weight:600;text-align:center;display:flex;justify-content:center;align-items:center;gap:8px;box-shadow:2px 2px 0 var(--hard);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--hard)}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--bad)}
.btn.danger.arm{background:var(--bad);color:var(--hard)}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.field{display:flex;flex-direction:column;gap:5px}
.field>label,.lab{font-size:12px;color:var(--muted);font-weight:600}
input[type=text],input[type=date],input[type=number],input[type=month],select{background:var(--surface);border:1.5px solid var(--field);border-radius:6px;padding:11px 12px;min-width:0;width:100%}
input:focus,select:focus{outline:2px solid var(--link);outline-offset:1px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.switch input{width:46px;height:26px;appearance:none;-webkit-appearance:none;border:1.5px solid var(--field);border-radius:4px;background:var(--surface2);position:relative;cursor:pointer;flex:none}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;background:var(--muted);transition:left .12s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:22px;background:var(--accent-fg)}
.colpick{display:flex;gap:8px;flex-wrap:wrap}
.colpick button{width:32px;height:32px;border:1.5px solid var(--edge);border-radius:4px}
.colpick button[aria-pressed="true"]{outline:3px solid var(--fg);outline-offset:2px}
.subw{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:6px 8px;align-items:center;font-size:13px}
.hist{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}

/* barra delle applicazioni */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:8px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1.5px solid var(--edge)}
.dock .wrap{display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr;gap:6px;align-items:center;padding:0}
.dock .tab{border:1.5px solid transparent;background:none;border-radius:6px;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-family:var(--pixel);font-size:10.5px;letter-spacing:.02em;text-transform:uppercase;min-width:0}
.dock .tab .px{width:18px;height:18px}
.dock .tab[aria-selected="true"]{color:var(--fg);border-color:var(--edge);background:var(--surface2);box-shadow:inset 2px 2px 0 color-mix(in srgb,var(--hard) 18%,transparent)}
.fab{width:58px;height:52px;justify-self:center;border:1.5px solid var(--edge);border-radius:8px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;box-shadow:3px 3px 0 var(--hard);transform:translateY(-10px);transition:transform .06s,box-shadow .06s}
.fab:active{transform:translate(3px,-7px);box-shadow:0 0 0 var(--hard)}
.fab .px{width:22px;height:22px}

/* fogli */
.scrim{position:fixed;inset:0;bottom:var(--kb,0px);z-index:20;background:rgba(6,8,12,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:540px;max-height:100%;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border:1.5px solid var(--edge);border-bottom:0;border-radius:12px 12px 0 0;display:flex;flex-direction:column}
.sheet .tbar{position:sticky;top:0;z-index:2}
.sheet .sb{padding:12px 14px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:11px}
.amtshow{font-family:var(--mono);font-weight:600;font-size:clamp(36px,11vw,48px);text-align:center;letter-spacing:-.03em;line-height:1.1}
.amtshow.zero{color:var(--muted)}
.amtshow .cur{font-size:.5em;opacity:.6;margin-right:6px;vertical-align:.3em}
.autohint{display:flex;align-items:flex-start;gap:6px;font-size:12.5px;color:var(--muted);min-height:18px;line-height:1.35}
.autohint .px{width:14px;height:14px;margin-top:2px;color:var(--link)}
.autohint b{color:var(--fg)}
.autohint.ask{color:var(--warn);font-weight:600}
.autohint.ask .px{color:var(--warn)}
.autohint.maybe{color:var(--fg)}
.strip{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin-inline:-14px;padding:2px 14px 4px}
.strip::-webkit-scrollbar{display:none}
.mc{flex:none;width:74px;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;padding:4px 2px}
.mc .tile{width:46px;height:46px;background:var(--surface)}
.mc .tile .px{width:22px;height:22px}
.mc > span:last-child{font-size:11.5px;font-weight:600;line-height:1.15;text-align:center;color:var(--fg);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mc[aria-pressed="true"] .tile{background:currentColor;box-shadow:2px 2px 0 var(--hard)}
.mc[aria-pressed="true"] .tile .px{color:var(--surface)}
.strip.need .tile{animation:nudge .4s steps(4,end)}
@keyframes nudge{0%,100%{transform:none}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.chip{flex:none;border:1.5px solid var(--field);background:var(--surface);border-radius:4px;padding:7px 11px;font-weight:600;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chip.maybe[aria-pressed="true"]{background:var(--surface2);color:var(--fg);border-style:dashed}
.seg2{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--edge);border-radius:6px;overflow:hidden}
.seg2 button{border:0;background:var(--surface);padding:9px;font-weight:600;font-family:var(--pixel);letter-spacing:.04em;font-size:14px}
.seg2 button+button{border-left:1.5px solid var(--edge)}
.seg2 button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.sheet.inmode #macStrip,.sheet.inmode #subStrip,.sheet.inmode details.more{display:none}
.sheet:not(.inmode) #inStrip{display:none}
.daterow{display:flex;gap:7px;align-items:center}
.daterow input{flex:1}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.keypad button{height:52px;border:1.5px solid var(--field);border-radius:6px;background:var(--surface2);font-family:var(--mono);font-size:22px;font-weight:600;box-shadow:2px 2px 0 var(--hard)}
.keypad button:active{transform:translate(2px,2px);box-shadow:none}
.sheet.typing .keypad{display:none}
.recbox{display:flex;align-items:center;gap:10px;border:1.5px dashed var(--line);border-radius:6px;padding:9px 11px;font-size:13px;color:var(--muted)}
.recbox span{flex:1}
details.more{border:1.5px solid var(--line);border-radius:6px;padding:8px 11px}
details.more summary{cursor:pointer;font-weight:600;font-size:13.5px}
details.more[open] summary{margin-bottom:8px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:6px;border:1.5px solid var(--edge);box-shadow:3px 3px 0 var(--hard);font-weight:600;font-size:13.5px;max-width:calc(100% - 32px)}
.toast b{font-family:var(--pixel);letter-spacing:.05em;color:#5B4BD6;margin-right:6px}

/* schermata di avvio (segreto) e migrazione */
.boot{position:fixed;inset:0;z-index:40;background:var(--hud-bg);color:var(--hud-acc);font-family:var(--mono);font-size:14px;padding:calc(40px + env(safe-area-inset-top,0px)) 24px;display:flex;flex-direction:column;gap:6px}
.boot .t{font-family:var(--pixel);font-size:26px;color:var(--hud-fg);margin-bottom:10px}
.boot .blink{animation:blink 1s steps(1,end) infinite}
@keyframes blink{50%{opacity:0}}
.mig{position:fixed;inset:0;z-index:35;background:var(--bg);overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.mig .win{max-width:540px;margin:0 auto}
@media (prefers-reduced-motion: no-preference){
  .sheet{animation:up .22s steps(5,end)}
  @keyframes up{from{transform:translateY(30px)}to{transform:none}}
}
@media (prefers-reduced-motion: reduce){ .view.enter,.glitch,.strip.need .tile,.boot .blink{animation:none} }
.fx-off .view.enter,.fx-off .glitch{animation:none}

/* voci personalizzabili */
.tbtn{background:none;border:0;color:var(--link);font-weight:600;font-size:12.5px;text-decoration:underline;text-underline-offset:3px;padding:2px 0;flex:none}
.hud .hbar .r{display:flex;align-items:center;gap:8px}

.hstats.n1{grid-template-columns:1fr}.hstats.n2,.hstats.n4{grid-template-columns:1fr 1fr}

.opts{display:flex;flex-direction:column}

.lab2{font-family:var(--pixel);font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
/* segreti: personaggi in pixel art */
.spr{display:block;width:100%;height:auto;image-rendering:pixelated}
.e-f2{opacity:0}
.eggov{position:fixed;inset:0;z-index:45;background:rgba(6,8,12,.72);display:grid;place-items:center;padding:20px}

.eggstage .spr{width:min(192px,60vw)}
.eggtxt{padding:12px 16px 0;text-align:center}

.coll{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ecard{border:1.5px solid var(--edge);border-radius:6px;padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;background:var(--surface2);text-align:center;min-width:0}
.ecard .stage{width:100%;max-width:78px;aspect-ratio:1;display:grid;place-items:center;background:#E9E6DD;border:1px solid var(--line);border-radius:4px;padding:5px}
.ecard.lock{border-style:dashed;border-color:var(--line);background:none}
.ecard.lock .stage{color:#9C9890;opacity:.6}
.ecard b{font-size:12.5px;line-height:1.2}
.ecard>span:last-child{font-size:11px;color:var(--muted);line-height:1.3}
@media (prefers-reduced-motion: no-preference){
  .anim .e-bounce{animation:eb .6s steps(1,end) infinite}
  @keyframes eb{50%{transform:translateY(-1px)}}
  .anim .e-ball{animation:eball .6s steps(1,end) infinite}
  @keyframes eball{0%{transform:translateY(-2px)}50%{transform:none}}
  .anim .e-leaf{animation:esw 1.6s steps(1,end) infinite}
  @keyframes esw{50%{transform:translateX(1px)}}
  .anim .e-glint{animation:egl 2.4s steps(1,end) infinite}
  @keyframes egl{0%,70%{opacity:0}75%,85%{opacity:1}90%{opacity:0}}
  .anim .e-f1{animation:ef .5s steps(1,end) infinite}
  .anim .e-f2{animation:ef .5s steps(1,end) -.25s infinite}
  @keyframes ef{0%{opacity:1}50%{opacity:0}}

  @keyframes eon{to{opacity:1}}
  @keyframes eglow{0%{opacity:1}50%{opacity:.5}}
  .anim .e-smoke{opacity:0;animation:esm 1.6s steps(4,end) 1.4s infinite}
  @keyframes esm{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-3px)}}
}
.brand{touch-action:manipulation}

/* filtro del periodo dei grafici */
.pfilter{display:flex}
.pbtn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--edge);border-radius:8px;background:var(--surface);padding:9px 12px;box-shadow:3px 3px 0 var(--hard)}

.prs{display:flex;flex-direction:column;border:1.5px solid var(--line);border-radius:6px;overflow:hidden}

.tip.r{transform:translate(-100%,-100%)}.tip.l{transform:translate(0,-100%)}

.tbar .tr{display:flex;align-items:center;gap:8px;flex:none;min-width:0}

.interp{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}

.mrow .tile{width:32px;height:32px}.mrow .tile .px{width:16px;height:16px}
.mrow .txt{flex:1;min-width:0;display:flex;flex-direction:column}

.sheet.qmode .seg2,.sheet.qmode #amtShow,.sheet.qmode #macStrip,.sheet.qmode #subStrip,.sheet.qmode #inStrip,.sheet.qmode .daterow,.sheet.qmode #freqStrip,.sheet.qmode .keypad,.sheet.qmode #fSave,.sheet.qmode .recbox{display:none}
.sheet.multimode #macStrip,.sheet.multimode #subStrip,.sheet.multimode #freqStrip{display:none}
.notice .nbtns{display:flex;align-items:center;gap:2px}
.nx{width:44px;height:44px;background:none;border:0;color:var(--muted);display:grid;place-items:center;padding:0}
/* v18: aree toccabili di almeno 44 px */
.linkbtn,.tbtn{min-height:44px;display:inline-flex;align-items:center}
.chip,.ichip{min-height:44px}
.hud .chip{min-height:0}
.tag.chk{display:inline;margin:0 0 0 6px}

.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

.keyrow i.kp{border-top:2.5px solid var(--link)} .keyrow i.kw{border-top:2px dashed var(--warn)} .keyrow i.kg{border-top:2px dotted var(--good)}

/* coppie di parole che insieme decidono (es. "spesa online", "occhiali da sole") */
const BIGRAMS = [["spesa","online","alim.online"],["occhia","sole","pers.altre"],["abbona","bus","auto.mobilita"],["abbona","palest","pers.altre"],["caffe","grani","alim.supermercato"],["olio","motore","auto.manutenzione"],["pulizi","denti","salute.dentista"],["pastig","lavast","casa.altre"]];
/* parole che indicano un viaggio: spostano mobilità, ristorazione ed eventi dentro Viaggi */
const TRAVEL = ["vacanz","viaggi","trasfer","gita"];
const TRAVEL_MAP = {"auto.mobilita":"viaggi.mobilita","risto.pasti":"viaggi.risto","risto.bar":"viaggi.risto","risto.aperitivo":"viaggi.risto","tempo.eventi":"viaggi.attivita"};

const KWL = {}; Object.keys(KW).forEach(k=>KWL[k]=KW[k].split(/\s+/).filter(Boolean).map(w=>w.replace(/\?$/,"")).map(w=>({w:w.replace(/^[=~]/,""), exact:w[0]==="=", weak:w[0]==="~"})));
const STOP = new Set("di da per il lo la i gli le un una uno al alla allo ai agli alle del dello della dei degli delle e ed in con su tra fra euro eur pagato pagata preso presa comprato comprata acquisto".split(" "));
function norm(s){ return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9&]+/g," ").trim(); }
const tokens = s => norm(s).split(" ").filter(t=>t.length>=2 && !/^\d/.test(t)).filter(t=>!STOP.has(t));
const kwHit = (t,k) => k.exact ? t===k.w : t.startsWith(k.w);
const stem = t => t.slice(0,6);
function near1(a,b){ if(a===b) return true; const la=a.length, lb=b.length; if(Math.abs(la-lb)>1) return false;
  let i=0,j=0,d=0; while(i<la&&j<lb){ if(a[i]===b[j]){i++;j++;continue;} if(++d>1) return false; if(la>lb) i++; else if(lb>la) j++; else {i++;j++;} } return d+(la-i)+(lb-j)<=1; }
const fuzzyHit = (t,k) => t.length>=6 && k.w.length>=6 && (k.exact ? near1(t,k.w) : near1(t.slice(0,k.w.length),k.w) || near1(t.slice(0,k.w.length+1),k.w) || near1(t.slice(0,k.w.length-1),k.w));

let S;          // stato
let learned=null;
/* storico delle tue classificazioni: radice di parola → "macro.sotto" (o "macro." se la sottocategoria mancava) */
function learnIndex(){ if(learned) return learned; learned={}; S.exps.forEach(e=>{ if(!e.note||e.ex||!e.mac) return; const k=e.mac+"."+(e.sub||"");
  new Set(tokens(e.note).map(stem)).forEach(t=>{ const o=learned[t]=learned[t]||{}; o[k]=(o[k]||0)+1; }); }); return learned; }

/* classificazione a due livelli con confidenza: {mac, sub, conf:"alta"|"media", subConf, why, how} oppure null */
function classify(text, amt){
  const tk=tokens(text); if(!tk.length) return null;
  const L=learnIndex(), sub={}, mex={}, why={}, how={};
  const put=(obj,key,v,t,h)=>{ obj[key]=(obj[key]||0)+v; const prev=how[key+"#v"]||0; if(v>=prev){ why[key]=t; how[key]=h; how[key+"#v"]=v; } };
  tk.forEach(t=>{
    const l=L[stem(t)]; if(l) Object.keys(l).forEach(k=>{ const [m,s]=k.split("."); if(!TAXM[m]) return; const v=Math.min(l[k],4)*2.5; if(s) put(sub,k,v,t,"learned"); else put(mex,m,v,t,"learned"); });
    S.macs.forEach(mc=>{
      (mc.words||[]).forEach(w=>{ const n=norm(w); if(n && (t===n || (n.length>=4 && stem(t)===stem(n)))) put(mex,mc.id,4,t,"words"); });
      Object.keys(mc.subWords||{}).forEach(s=>(mc.subWords[s]||[]).forEach(w=>{ const n=norm(w); if(n && (t===n || (n.length>=4 && stem(t)===stem(n)))) put(sub,mc.id+"."+s,4,t,"words"); }));
    });
    let hit=false;
    Object.keys(KWL).forEach(k=>{ const ks=KWL[k].filter(x=>kwHit(t,x)); if(ks.length){ hit=true; put(sub,k,ks.some(x=>!x.weak)?2:1,t,"dict"); } });
    if(!hit) Object.keys(KWL).forEach(k=>{ if(KWL[k].some(x=>!x.weak && fuzzyHit(t,x))) put(sub,k,1.5,t,"fuzzy"); });
  });
  const st=tk.map(stem);
  BIGRAMS.forEach(([a,b,k])=>{ if(st.some(x=>x.startsWith(a)) && st.some(x=>x.startsWith(b))) put(sub,k,4,a+" "+b,"bigram"); });
  if(st.some(x=>TRAVEL.some(w=>x.startsWith(w.slice(0,6))))) Object.keys(TRAVEL_MAP).forEach(k=>{ if(sub[k]){ put(sub,TRAVEL_MAP[k],sub[k]+1,why[k],"travel"); delete sub[k]; } });
  if(amt && amt>1000 && sub["risto.bar"]) sub["risto.bar"]-=1.5;   // al bar si spende poco: oltre 10 € è più probabile altro
  const ms={};
  TAX.forEach(m=>{ let best=0; m.subs.forEach(s=>{ best=Math.max(best, sub[m.id+"."+s[0]]||0); }); const v=best+(mex[m.id]||0); if(v>0) ms[m.id]=v; });
  const mr=Object.keys(ms).sort((a,b)=>ms[b]-ms[a]); if(!mr.length) return null;
  const s1=ms[mr[0]], s2=mr[1]?ms[mr[1]]:0; if(s1<1 || s1===s2) return null;
  const m=mr[0], subs=TAXM[m].subs.map(s=>s[0]).filter(s=>sub[m+"."+s]>0).sort((a,b)=>sub[m+"."+b]-sub[m+"."+a]);
  const winKey = subs[0] ? m+"."+subs[0] : m;
  const strong = ["learned","words","bigram"].indexOf(how[winKey] || how[m])>=0;
  const conf = (s1>=2 && s1>=2*s2) || (strong && s1>s2) ? "alta" : "media";
  let sb=null, subConf=null;
  if(subs.length){ const t1=sub[m+"."+subs[0]], t2=subs[1]?sub[m+"."+subs[1]]:0;
    if(t1>t2){ sb=subs[0]; subConf = (t1>=2*t2 && conf==="alta") ? "alta" : "media"; } }
  const w = why[winKey] || why[m] || tk[0];

/* "5 euro di sigarette", "sigarette 5,50", "€12 pranzo" → importo + descrizione. Con più numeri vince quello con € o "euro". */
function parseEntry(text){
  text=String(text); const re=/(?:€\s*)?(\d{1,6}(?:[.,]\d{1,2})?)\s*(?:€|euro|eur\b)?/gi; let m, best=null;

  const note=(text.slice(0,best.i)+" "+text.slice(best.i+best.n)).replace(/\s+/g," ").trim().replace(/^(di|da|per|in)\s+/i,"");
  return {amt:best.v.replace(".",","), note: note? note.charAt(0).toUpperCase()+note.slice(1) : ""};

const WDAYS = ["domenica","lunedi","martedi","mercoledi","giovedi","venerdi","sabato"];

function parseWhen(low){
  let m; const t=dateObj(today()), ok=(y,mo,d)=> mo>=1 && mo<=12 && d>=1 && d<=daysIn(y+"-"+pad(mo));
  if((m=/\b(?:l'?\s?)?altro\s?ieri\b/.exec(low))) return {date:dShift(-2), i:m.index, n:m[0].length};
  if((m=/\bieri\b/.exec(low))) return {date:dShift(-1), i:m.index, n:m[0].length};
  if((m=/\boggi\b/.exec(low))) return {date:today(), i:m.index, n:m[0].length};
  if((m=/\b(lunedi|martedi|mercoledi|giovedi|venerdi|sabato|domenica)(?:\s+scors[oa])?\b/.exec(low))) return {date:dShift(-((t.getDay()-WDAYS.indexOf(m[1])+7)%7)), i:m.index, n:m[0].length};

    if(ok(y,mo,d)){ if(!m[3] && y+"-"+pad(mo)+"-"+pad(d)>today()) y--; return {date:y+"-"+pad(mo)+"-"+pad(d), i:m.index, n:m[0].length}; } }

    if(ok(y,mo,d)){ if(!m[3] && y+"-"+pad(mo)+"-"+pad(d)>today()) y--; return {date:y+"-"+pad(mo)+"-"+pad(d), i:m.index, n:m[0].length}; } }

/* frase intera → voci (una o più), data e ripetizione. Più voci solo se ogni pezzo ha un importo e una descrizione */
function parseText(text){
  let s=String(text); const low0=lowIt(s); if(low0.length!==s.length) s=low0; let low=low0;
  const cut=(i,n)=>{ s=s.slice(0,i)+" ".repeat(n)+s.slice(i+n); low=low.slice(0,i)+" ".repeat(n)+low.slice(i+n); };
  const w=parseWhen(low); if(w) cut(w.i,w.n);
  let freq=null; for(const [k,re] of FREQ_TXT){ const m=re.exec(low); if(m){ freq=k; cut(m.index,m[0].length); break; } }
  const re=/(?:€\s*)?(\d{1,6}(?:[.,]\d{1,2})?)\s*(?:€|euro|eur\b)?/gi, ms=[]; let m;
  while((m=re.exec(s))) ms.push({i:m.index, n:m[0].length});
  const clean=x=>x.replace(/\s+/g," ").trim().replace(/^(?:[,;+&]\s*)+/,"").replace(/(?:\s*[,;+&])+$/,"").replace(/^(?:e|ed|poi|piu|più)\s+/i,"").replace(/\s+(?:e|ed|poi)$/i,"").replace(/^(?:di|da|per|in)\s+/i,"").trim();
  const capf=x=>x? x.charAt(0).toUpperCase()+x.slice(1) : "";
  const one=()=>{ const p=parseEntry(s); return [{amt:p.amt, note:capf(clean(p.note))}]; };
  let items;
  if(ms.length<2) items=one();
  else { const lead=clean(s.slice(0,ms[0].i))==="", segs=[];
    ms.forEach((x,k)=>{ const a= lead? x.i : (k? ms[k-1].i+ms[k-1].n : 0), b= lead? (k<ms.length-1? ms[k+1].i : s.length) : (k<ms.length-1? x.i+x.n : s.length); segs.push(s.slice(a,b)); });
    items=segs.map(g=>{ const p=parseEntry(g); return {amt:p.amt, note:capf(clean(p.note))}; });
    if(items.some(it=>!it.amt || !tokens(it.note).length)) items=one(); }
  return {items, date:w?w.date:null, freq};

/* domanda sulle spese → totale e numero, per categoria (o parola della descrizione) e periodo. Se non capisce, lo dice. */
function askSpese(text){
  let low=" "+norm(text)+" "; const t=dateObj(today()), td=today(), cy=t.getFullYear();
  let from, to, label, defaulted=false, m;
  const take=re=>{ const x=re.exec(low); if(x){ low=low.slice(0,x.index)+" "+low.slice(x.index+x[0].length); } return x; };
  const monthRange=p=>{ from=p+"-01"; to= p===ymOf(td)? td : p+"-"+pad(daysIn(p)); label=monthName(p); };
  if(take(/ (?:l )?altro ?ieri /)){ from=to=dShift(-2); label="l'altro ieri"; }
  else if(take(/ ieri /)){ from=to=dShift(-1); label="ieri"; }
  else if(take(/ oggi /)){ from=to=td; label="oggi"; }
  else if(take(/ (?:la )?(?:settimana scorsa|scorsa settimana) /)){ const dw=(t.getDay()+6)%7; from=dShift(-dw-7); to=dShift(-dw-1); label="la settimana scorsa"; }
  else if(take(/ (?:questa |la )?settimana /)){ const dw=(t.getDay()+6)%7; from=dShift(-dw); to=td; label="questa settimana"; }
  else if(take(/ (?:il )?(?:mese scorso|scorso mese) /)){ monthRange(ymAdd(ymOf(td),-1)); }
  else if((m=take(new RegExp(" (?:a |ad |in |di |nel mese di )?("+MESI.join("|")+")(?: (\\d{4}))? ")))){ const mi=MESI.indexOf(m[1]); let y=m[2]? +m[2] : cy; if(!m[2] && mi>t.getMonth()) y--; monthRange(y+"-"+pad(mi+1)); }
  else if(take(/ (?:l )?(?:anno scorso|scorso anno) /)){ from=(cy-1)+"-01-01"; to=(cy-1)+"-12-31"; label="nel "+(cy-1); }
  else if((m=take(/ (?:nel )?(20\d\d) /))){ from=m[1]+"-01-01"; to= +m[1]===cy? td : m[1]+"-12-31"; label="nel "+m[1]; }
  else if(take(/ (?:quest ?anno|quest anno|l anno|anno) /)){ from=cy+"-01-01"; to=td; label="da inizio "+cy; }
  else if(take(/ (?:questo |il )?mese /)){ monthRange(ymOf(td)); }
  else { monthRange(ymOf(td)); defaulted=true; }
  const QSTOP=new Set("quanto quanta quanti quante ho hai ha abbiamo avete speso spesi spese spendo spendere costato costata costati costa costano totale somma in di da per a ad al allo alla ai agli alle il lo la i gli le l un una del dello della dei degli delle nel nello nella nei negli nelle sul sulla e mi ci tra fra su euro eur fatto fatta fatte fatti cosa che".split(" "));
  const rest=low.split(" ").filter(x=>x && !QSTOP.has(x) && !/^\d+$/.test(x)), inR=e=>e.date>=from && e.date<=to;
  if(rest.length && rest.length<=2 && rest.some(x=>/^(entrat|guadagn|incass|stipend)/.test(x))){ const l=(S.ins||[]).filter(inR); return {ok:true, kind:"in", tot:sum(l), n:l.length, what:"di entrate", label, defaulted, from, to}; }
  let f=null, what="in tutto"; const spec={};
  if(rest.length){ const ph=rest.join(" ");
    TAX.forEach(mc=>{ if(!f && norm(mc.name)===ph){ f=e=>e.mac===mc.id; what="in "+mc.name; spec.cats=[mc.id]; } });
    if(!f) TAX.some(mc=>mc.subs.some(([k,n])=>{ const nt=norm(n).split(" "); if(norm(n)===ph || rest.every(x=>nt.includes(x))){ f=e=>e.mac===mc.id && e.sub===k; what="in "+mc.name+" → "+n; spec.cats=[mc.id+"."+k]; return true; } return false; }));
    if(!f){ const g=classify(ph,0); if(g){ const mc=g.mac, sb=g.sub; if(sb){ f=e=>e.mac===mc && e.sub===sb; what="in "+macName(mc)+" → "+subName(mc,sb); spec.cats=[mc+"."+sb]; } else { f=e=>e.mac===mc; what="in "+macName(mc); spec.cats=[mc]; } } }
    if(!f){ const st=rest.map(stem), has=e=>!!e.note && st.every(x=>tokens(e.note).some(y=>stem(y)===x));
      if(S.exps.some(e=>consumption(e) && has(e))){ f=has; what="con «"+rest.join(" ")+"» nella descrizione"; spec.q=rest.join(" "); } }
    if(!f) return {ok:false, unknown:rest.join(" ")};
  }
  const l=S.exps.filter(e=>consumption(e) && inR(e) && (!f||f(e)));
  return {ok:true, kind:"out", tot:sum(l), n:l.length, what, label, defaulted, from, to, spec};

function stripWF(text){ let s=String(text); const low0=lowIt(s); if(low0.length!==s.length) s=low0; let low=low0;
  const cut=(i,n)=>{ s=s.slice(0,i)+" ".repeat(n)+s.slice(i+n); low=low.slice(0,i)+" ".repeat(n)+low.slice(i+n); };

  const n=fresh(); n.v=4; n.examples=!!o.examples; n.lastBackup=o.lastBackup||null; n.persisted=!!o.persisted;
  const rep={count:o.exps.length, total:sum(o.exps), full:0, macOnly:0, none:0, budgets:[], recs:(o.recs||[]).length, words:0};
  n.exps=o.exps.map(e=>{ const c=byId[e.cat]||{kind:"other",name:""}; const [m,s]=mapCat(c,e.note);
    if(m&&s) rep.full++; else if(m) rep.macOnly++; else rep.none++;
    const x={id:e.id,amt:e.amt,mac:m,sub:s,date:e.date,note:e.note||"",ts:e.ts}; if(e.rec) x.rec=e.rec; if(e.ex) x.ex=true; return x; });

  const bOf=(c,ym)=>{ let a=0; (c.budgets||[]).forEach(b=>{ if(b.from<=ym) a=b.amt; }); return a; };

function setBudget(m,amt){
  const cur=ymOf(today()); m.budgets=m.budgets||[];

  if(budgetOf(m,cur)===amt) return;

}

function patternOf(e){

/* base delle spese variabili per macro-categoria (mediana dei mesi di base), fondo imprevisti, stagionalità */
function expenseBase(ref, fixedKeys){
  const B=baseMonths(ref,6), isVar=e=>consumption(e) && !e.rec && !fixedKeys.has(expKey(e)) && natOf(e)!=="str";
  const monthCat={}; B.forEach(y=>{ monthCat[y]={}; }); S.exps.forEach(e=>{ const y=ymOf(e.date); if(!monthCat[y] || !isVar(e)) return; const c=e.mac||"__chk"; monthCat[y][c]=(monthCat[y][c]||0)+e.amt; });
  const ids=[...new Set(B.flatMap(y=>Object.keys(monthCat[y])))];
  const cats=ids.map(id=>{ const vals=B.map(y=>monthCat[y][id]||0); return {id, med:Math.round(median(vals)), vals}; }).filter(c=>c.med>0 || c.vals.some(v=>v>0)).sort((a,b)=>b.med-a.med);
  const totals=B.map(y=>Object.values(monthCat[y]).reduce((t,v)=>t+v,0));
  const B12=baseMonths(ref,12), str=sum(S.exps.filter(e=>consumption(e) && !e.rec && B12.includes(ymOf(e.date)) && natOf(e)==="str")), fund=B12.length? Math.round(str/B12.length) : 0;
  // stagionalità: solo con 12 mesi chiusi; scostamento dello stesso mese dell'anno prima rispetto alla mediana dei 12 mesi
  const seasonal = B12.length>=12; let seas=null;
  if(seasonal){ seas={}; const mc12={}; B12.forEach(y=>{ mc12[y]={}; }); S.exps.forEach(e=>{ const y=ymOf(e.date); if(!mc12[y] || !isVar(e)) return; const c=e.mac||"__chk"; mc12[y][c]=(mc12[y][c]||0)+e.amt; });
    ids.forEach(id=>{ const vals=B12.map(y=>mc12[y][id]||0), md=median(vals); seas[id]={}; B12.forEach(y=>{ const dv=(mc12[y][id]||0)-md; if(Math.abs(dv)>0.2*md && Math.abs(dv)>2000) seas[id][y.slice(5)]=Math.round(dv); }); }); }
  return {B, cats, totals, fund, strTot:str, n12:B12.length, seasonal, seas};
}
/* previsione delle spese di un mese chiuso usando solo i mesi precedenti (per l'affidabilità) */
function predictMonth(M){
  const fx=fixedDetected(M), fk=new Set(fx.map(x=>x.key)), eb=expenseBase(M,fk); if(eb.B.length<2) return null;
  const mm=M.slice(5), seasAdd= eb.seasonal? eb.cats.reduce((t,c)=>t+((eb.seas[c.id]||{})[mm]||0),0) : 0;
  return recAmtIn(recsOut(),M) + fx.reduce((t,x)=>t+x.amt,0) + eb.cats.reduce((t,c)=>t+c.med,0) + seasAdd + eb.fund;
}
function backtest(ref){ const rows=[]; baseMonths(ref,6).forEach(M=>{ const p=predictMonth(M); if(p===null) return; const a=sum(expsOf(M)); rows.push({ym:M, pred:Math.round(p), act:a, err:Math.abs(Math.round(p)-a)}); });
  return {n:rows.length, mae: rows.length? Math.round(rows.reduce((t,r)=>t+r.err,0)/rows.length) : null, avg: rows.length? Math.round(rows.reduce((t,r)=>t+r.act,0)/rows.length) : null, rows:rows.reverse()}; }
/* simulazione: mese in corso = previsione di fine mese; mesi futuri = base + leve; tre scenari */
function simulate(hOverride){
  const sv=SIMV(), cur=ymOf(today()), B=baseMonths(cur,6);
  if(B.length<2) return {ok:false, have:B.length};
  const h=Math.max(hOverride||0, sv.h||12), m=monthCtx(cur), groups=incomeGroups(cur), used=groups.filter(g=>g.state!=="no");
  const fx=fixedDetected(cur), fk=new Set(fx.map(x=>x.key)), eb=expenseBase(cur,fk);
  // entrate variabili: tutto ciò che non è regolare né da ricorrenza, media dei mesi di base
  const regKeys=new Set(used.map(g=>g.key)), varTot=sum((S.ins||[]).filter(e=>!e.rec && B.includes(ymOf(e.date)) && !regKeys.has(incKey(e)))), varMean=Math.round(varTot/B.length);
  const cutOf=id=>Math.max(-100,Math.min(50,+((sv.cut||{})[id]||0)))/100, varProb=eb.cats.reduce((t,c)=>t+c.med*(1+cutOf(c.id)),0), varBase=eb.cats.reduce((t,c)=>t+c.med,0);
  const scale= varBase? varProb/varBase : 1, lo=eb.totals.length? Math.min(...eb.totals)*scale : varProb, hi=eb.totals.length? Math.max(...eb.totals)*scale : varProb;
  const incF = ym => sv.incCh && sv.incCh.from && ym>=sv.incCh.from ? 1+(+sv.incCh.pct||0)/100 : 1;
  const p0=potCtx(ymAdd(cur,-1)), start= p0? p0.pot : (S.pot0&&S.pot0.amt)||0; let pot=start, potLo=start, potHi=start;
  const months=[];
  for(let k=0;k<h;k++){ const ym=ymAdd(cur,k), mm=ym.slice(5);
    const ev=(sv.events||[]).filter(x=>x.ym===ym), evIn=ev.filter(x=>x.dir==="in").reduce((t,x)=>t+x.amt,0), evOut=ev.filter(x=>x.dir!=="in").reduce((t,x)=>t+x.amt,0);
    let inc, out, outLo, outHi;
    if(k===0){
      // mese in corso: entrate registrate + attese (ricorrenze in arrivo e entrate regolari non ancora arrivate); spese = previsione di fine mese
      const missing=used.filter(g=>!(g.months[cur]>0)).reduce((t,g)=>t+g.amt,0);
      inc=m.inTot+m.upInTot+missing+evIn; out=m.proj+evOut; outLo=out; outHi=out;
    } else {
      const seasIn= eb.seasonal? used.reduce((t,g)=>{ const y12=ymAdd(ym,-12), v=g.months[y12]||0; const dv=v-g.amt; return t+((Math.abs(dv)>0.2*g.amt && Math.abs(dv)>2000)? dv : 0); },0) : 0;
      inc=Math.round((used.reduce((t,g)=>t+g.amt,0)+seasIn)*incF(ym)) + Math.round(recAmtIn(recsIn(),ym)*incF(ym)) + (sv.varIn? varMean : 0) + evIn;
      const fixed=recAmtIn(recsOut(),ym)+fx.reduce((t,x)=>t+x.amt,0), seasOut= eb.seasonal? eb.cats.reduce((t,c)=>t+((eb.seas[c.id]||{})[mm]||0)*(1+cutOf(c.id)),0) : 0;
      const adds=(sv.adds||[]).filter(a=>!a.from || ym>=a.from).reduce((t,a)=>t+a.amt,0), common=fixed+seasOut+eb.fund+adds+evOut;
      out=Math.round(common+varProb); outLo=Math.round(common+lo); outHi=Math.round(common+hi);
    }
    const sav=inc-out; pot+=sav; potLo+=inc-outHi; potHi+=inc-outLo;
    months.push({ym, inc, out, sav, pot, potLo, potHi, outLo, outHi, isCur:k===0, ev:ev.map(x=>x.name)});
  }
  return {ok:true, h, start, months, base:{B, groups, recIn:recsIn().filter(recActive), recOut:recsOut().filter(recActive), fx, eb, varMean, varProb:Math.round(varProb), lo:Math.round(lo), hi:Math.round(hi)}, bt:backtest(cur)};
}
/* obiettivi: l'accantonato di oggi si attribuisce in ordine; fattibilità con il risparmio probabile */
function goalsPlan(E){
  const cur=ymOf(today()), gs=(S.goals||[]).slice(); let free= E? E.start : (()=>{ const p=potCtx(ymAdd(cur,-1)); return p? p.pot : 0; })(), need=0;
  return gs.map(g=>{ const alloc=Math.max(0,Math.min(g.amt,free)); free-=alloc; need+=g.amt; const left=Math.max(1, ymDiff(cur,g.ym)+1), perM=Math.max(0,Math.round((g.amt-alloc)/left));
    let st=null; if(E && E.ok){ const row=E.months.find(x=>x.ym===g.ym); if(row){ const gap=need-row.pot; st= gap<=0 ? {ok:true, margin:Math.round(-gap/left)} : {ok:false, short:Math.round(gap/left)}; } }
    return Object.assign({}, g, {alloc, left, perM, st}); });
}

/* ---------- traguardi (solo spese vere, non di esempio) ---------- */
function weeksUnder(){
  if(!S.exps.length) return 0; let n=0; const t=new Date(); const dow=(t.getDay()+6)%7; let end=new Date(t.getFullYear(),t.getMonth(),t.getDate()-dow-1);
  for(let w=0; w<52; w++){ const start=new Date(end.getFullYear(),end.getMonth(),end.getDate()-6), s=iso(start), e=iso(end), ym=ymOf(e);
    const b=budgetSet(ym); if(b===null) break; const spent=sum(S.exps.filter(x=>!x.ex && consumption(x) && x.date>=s && x.date<=e));
    const first=S.exps.filter(x=>!x.ex).reduce((a,x)=>!a||x.date<a?x.date:a,null); if(!first || first>s) break;
    if(spent<=b*7/daysIn(ym)) n++; else break; end=new Date(start.getFullYear(),start.getMonth(),start.getDate()-1); }
  return n;
}
function dayStreak(){ const d=new Set(S.exps.filter(e=>!e.ex).map(e=>e.date)); let n=0, best=0; const all=[...d].sort(); for(let i=0;i<all.length;i++){ n = i && dayDiff(all[i-1],all[i])===1 ? n+1 : 1; best=Math.max(best,n); } return best; }

function metVal(k,m,pc){
  // budget non impostato → stato neutro, si imposta toccando; stipendio non registrato nel mese in corso → in attesa.
  // Il rosso è solo per uno sforamento reale del budget: un valore negativo resta riconoscibile dal segno.
  const cur=m.isCur, tb=m.tb||0, inAll=m.inTot+(cur?m.upInTot:0), pos=v=>v>=0?"good":"";
  const E=(l,v,cls,cents,pre)=>({l, v, cls, full:(pre||"")+(cents?euro(v):euro0(v)), short:(pre||"")+euro0(v)}), NA=(l,why,act)=>({l, na:why, act});
  const NOB=l=>NA(l,"Imposta budget","budget"), WAIT=l=>({l, wait:true, sofar:m.saving}), BUD=o=>Object.assign(o,{act:"budget"});
  const waitA = cur && m.wait, waitP = cur && m.wait && !m.expStip;   // effettivo: serve lo stipendio registrato; previsto: basta quello atteso da una ricorrenza
  switch(k){
    case "entrate":  return Object.assign(E("Entrate",inAll,"good",true,"+"), {subs: cur&&m.upInTot? [["di cui attese","+"+euro0(m.upInTot)]] : null});
    case "spese":    return E("Spese",m.tot,"",true);
    case "budget":   return m.hasB? BUD(E("Budget",tb,"",false)) : NOB("Budget");
    case "saldo":    return m.hasB? BUD(E("Budget residuo",tb-m.tot,tb-m.tot>=0?"good":"bad",true)) : NOB("Budget residuo");

function bucketize(from,to,g){ const out=[]; let s=from, k=0;

function budgetCover(from,to,list){ const f0=firstDataYm(), o={bud:0, spent:0, months:0, skip:0, any:false}; if(!f0) return o;

const LF0 = () => ({type:"all", cats:[], per:"auto", from:null, to:null, q:"", nat:[], chk:false, rec:false, min:"", sort:"date"});
function LF(){ if(!ui.lf) ui.lf=LF0(); return ui.lf; }
const lfMin = f => { const v=parseFloat(String(f.min||"").replace(",",".")); return isFinite(v) && v>0 ? Math.round(v*100) : 0; };
const lfExtra = f => (f.q.trim()?1:0)+(f.nat.length?1:0)+(f.chk?1:0)+(f.rec?1:0)+(lfMin(f)?1:0)+(f.sort!=="date"?1:0);

// periodo della lista: "recenti" = ultimi 7 giorni (anche del mese prima) se guardi il mese in corso, altrimenti il mese scelto con le frecce
function lfRange(){
  const f=LF(), td=today(), cur=ui.ym===ymOf(td), mEnd=ui.ym+"-"+pad(daysIn(ui.ym));
  switch(f.per){
    case "auto": if(!cur) return {from:ui.ym+"-01", to:mEnd, label:monthName(ui.ym)};
      { const n=7*(ui.weeks||1); return {from:addDays(td,-(n-1)), to:td, label:"ultimi "+n+" giorni", auto:true}; }
    case "30g": return {from:addDays(td,-29), to:td, label:"ultimi 30 giorni"};
    case "mese": return {from:ui.ym+"-01", to: cur? td : mEnd, label:monthName(ui.ym)};
    case "anno": { const y=ui.ym.slice(0,4); return {from:y+"-01-01", to: y===td.slice(0,4)? td : y+"-12-31", label:"anno "+y}; }
    default: { let a=f.from||td, b=f.to||td; if(a>b){ const t=a; a=b; b=t; } return {from:a, to:b, label:fmtD(a, a.slice(0,4)!==b.slice(0,4))+" – "+fmtD(b,true)}; }
  }
}
function lfMatch(e,f){
  const isIn=!!e.kind, inv=!isIn && isInvest(e);
  if(f.type==="out" && (isIn||inv)) return false; if(f.type==="in" && !isIn) return false; if(f.type==="inv" && !inv) return false;
  if(f.cats.length){ if(isIn) return false;
    // una sottocategoria scelta restringe la sua macro; più scelte valgono come "oppure"
    if(!f.cats.some(c=>{ if(c==="__chk") return !e.mac; if(c.indexOf(".")>0) return (e.mac+"."+e.sub)===c; if(e.mac!==c) return false; return !f.cats.some(x=>x.indexOf(c+".")===0); })) return false; }
  if(f.nat.length && (isIn || !f.nat.includes(natOf(e)))) return false;
  if(f.chk && (isIn || !toCheck(e))) return false;
  if(f.rec && !e.rec) return false;
  const mn=lfMin(f); if(mn && e.amt<mn) return false;
  if(f.q.trim()){ const ws=norm(f.q).split(" ").filter(Boolean), hay=norm((e.note||"")+" "+(isIn? (INK[e.kind]||"") : macName(e.mac)+" "+(subName(e.mac,e.sub)||""))); if(!ws.every(w=>hay.includes(w))) return false; }
  return true;
}

  const v=$("v-stats"); v.innerHTML=h;

}

const catName = id => id==="__chk"? "Da verificare" : macName(id);
function setSim(p){ S.sim=Object.assign(SIMV(), p); save(); renderSim(); }
// linee nel tempo con fascia tra prudente e ottimista
function lineSVG(labels, series, band, aria){
  const n=labels.length, W=340, H=180, T=12, Bm=24, Rt=8, all=series.flatMap(s=>s.vals).concat(band? band[0].concat(band[1]) : []);
  const mx=Math.max(0,...all), mn=Math.min(0,...all), top=niceMax(Math.max(1,mx)), lo= mn<0? -niceMax(-mn) : 0;
  const L=Math.max(40, Math.ceil(Math.max(euro0(top).length, euro0(lo).length)*6.1)+10), cw=(W-L-Rt)/Math.max(1,n-1);
  const y=v=>T+(H-T-Bm)*(top-v)/((top-lo)||1), x=i=>L+i*cw;
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(aria||"")+'">';
  (lo? [top,0,lo] : [top,top/2,0]).forEach(q=>{ const yy=y(q).toFixed(1); s+='<line x1="'+L+'" x2="'+(W-Rt)+'" y1="'+yy+'" y2="'+yy+'" stroke="'+(q===0&&lo?"var(--muted)":"var(--line)")+'"/><text x="'+(L-6)+'" y="'+(+yy+3.5)+'" text-anchor="end" font-size="10" font-family="IBM Plex Mono, monospace" fill="var(--muted)">'+euro0(q).replace(/\s/g," ")+'</text>'; });
  if(band){ const a=band[0].map((v,i)=>x(i).toFixed(1)+" "+y(v).toFixed(1)), b=band[1].map((v,i)=>x(i).toFixed(1)+" "+y(v).toFixed(1)).reverse(); s+='<path d="M'+a.join("L")+"L"+b.join("L")+'Z" fill="var(--accent)" fill-opacity=".16"/>'; }
  series.forEach(se=>{ s+='<path d="'+se.vals.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)).join("")+'" fill="none" stroke="'+se.col+'" stroke-width="'+(se.w||2)+'"'+(se.dash?' stroke-dasharray="'+se.dash+'"':'')+' stroke-linejoin="round"/>'; });
  const k=Math.max(1,Math.ceil(n/7)); labels.forEach((lb,i)=>{ if((n-1-i)%k===0) s+='<text x="'+x(i).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle" font-size="9.5" font-family="IBM Plex Mono, monospace" fill="var(--muted)">'+esc(lb)+'</text>'; });
  return '<div class="chartbox">'+s+'</svg></div>';
}

    else bc+='<p class="hint">Affidabilità: per verificarla serve un mese chiuso con almeno 2 mesi prima.</p>';

/* foglio per una leva: spesa mensile, variazione delle entrate, evento */
function openLeverSheet(kind){
  const nx=ymAdd(ymOf(today()),1), T={adds:"Spesa in più al mese", incCh:"Variazione delle entrate", events:"Evento una tantum"}[kind];
  let h=sheetHead(T)+'<div class="sb">';
  if(kind==="adds") h+='<div class="field"><label for="lvN">Cosa</label><input type="text" id="lvN" maxlength="40" placeholder="es. palestra" autocomplete="off"></div><div class="field"><label for="lvA">Importo al mese, in euro</label><input type="number" inputmode="decimal" min="0" id="lvA"></div><div class="field"><label for="lvM">Dal mese</label><input type="month" id="lvM" value="'+nx+'" min="'+nx+'"></div>';
  if(kind==="incCh") h+='<div class="field"><label for="lvA">Variazione delle entrate regolari, in %</label><input type="number" inputmode="decimal" id="lvA" placeholder="es. 5 oppure -10"></div><div class="field"><label for="lvM">Dal mese</label><input type="month" id="lvM" value="'+nx+'" min="'+nx+'"></div>';
  if(kind==="events") h+='<div class="seg2" role="group" aria-label="Tipo"><button data-evd="out" aria-pressed="true">− Spesa</button><button data-evd="in" aria-pressed="false">+ Entrata</button></div><div class="field"><label for="lvN">Cosa</label><input type="text" id="lvN" maxlength="40" placeholder="es. vacanza, tredicesima" autocomplete="off"></div><div class="field"><label for="lvA">Importo, in euro</label><input type="number" inputmode="decimal" min="0" id="lvA"></div><div class="field"><label for="lvM">Mese</label><input type="month" id="lvM" value="'+nx+'" min="'+ymOf(today())+'"></div>';
  h+='<button class="btn primary" id="lvSave">Aggiungi</button></div>';
  const sh=$("sheet"); sh.innerHTML=h; sh.classList.remove("typing","inmode","qmode","multimode"); showSheet(); $("shClose").onclick=closeSheet;
  let dir="out"; sh.querySelectorAll("[data-evd]").forEach(b=>{ b.onclick=()=>{ dir=b.getAttribute("data-evd"); sh.querySelectorAll("[data-evd]").forEach(x=>x.setAttribute("aria-pressed", x===b)); }; });
  $("lvSave").onclick=()=>{ const a=parseFloat(String($("lvA").value).replace(",",".")), mo=String($("lvM").value||"").slice(0,7), nm=$("lvN")? $("lvN").value.trim() : "";
    if(!isFinite(a) || (kind!=="incCh" && a<=0)){ toast("Indica l'importo"); return; } if(!/^\d{4}-\d{2}$/.test(mo)){ toast("Indica il mese"); return; }
    const s=SIMV(); if(kind==="adds") s.adds=(s.adds||[]).concat([{name:nm||"Spesa", amt:Math.round(a*100), from:mo}]);
    else if(kind==="incCh") s.incCh={pct:Math.max(-100,Math.min(200,Math.round(a))), from:mo};

    S.sim=s; save(); closeSheet(); renderSim(); toast("Leva aggiunta"); };
}
/* foglio obiettivo */

/* ---------- sfida della settimana: proposte dai tuoi dati, esito a fine settimana ---------- */
const monday = d => { const t=dateObj(d), k=(t.getDay()+6)%7; return iso(new Date(t.getFullYear(),t.getMonth(),t.getDate()-k)); };
function chalProposals(){
  const mon=monday(today()), wk=[]; for(let i=1;i<=8;i++) wk.push(addDays(mon,-7*i));
  const ex=S.exps.filter(e=>consumption(e) && e.mac && e.sub && !e.rec && e.date>=wk[7] && e.date<mon && ["disc","abit"].includes(natOf(e)));
  const by={}; ex.forEach(e=>{ const k=e.mac+"."+e.sub; (by[k]=by[k]||[]).push(e); });
  const st=Object.keys(by).map(k=>{ const w=wk.map(m=>sum(by[k].filter(e=>e.date>=m && e.date<=addDays(m,6)))); return {k, weeks:w.filter(v=>v>0).length, med:median(w), tot:sum(by[k])}; });
  const out=[], sn=k=>subName(k.split(".")[0],k.split(".")[1]);
  const fq=st.filter(s=>s.weeks>=4).sort((a,b)=>b.weeks-a.weeks||b.tot-a.tot)[0];
  if(fq) out.push({id:"zero."+fq.k, kind:"zero", key:fq.k, label:"Settimana senza "+sn(fq.k).toLowerCase(), limit:0});
  const bg=st.filter(s=>s.med>=500 && (!fq || s.k!==fq.k)).sort((a,b)=>b.med-a.med)[0];
  if(bg){ const lim=Math.max(100, Math.round(bg.med*0.7/100)*100); out.push({id:"cap."+bg.k, kind:"cap", key:bg.k, label:sn(bg.k)+" sotto "+euro0(lim)+" in settimana", limit:lim}); }
  out.push({id:"log", kind:"log", label:"Registra le spese tutti i giorni"});
  return out;
}
// solo spese vere (non di esempio); la sfida vale se registri almeno 5 giorni (o tutti, se dura meno)
function chalState(c){
  const td=today(), to=td<c.end?td:c.end, total=dayDiff(c.start,c.end)+1, span=Math.max(0,dayDiff(c.start,to)+1);
  const days=new Set(S.exps.concat(S.ins||[]).filter(e=>!e.ex && e.date>=c.start && e.date<=to).map(e=>e.date)).size;
  if(c.kind==="log") return {days, span, total, ok: days>=total, spent:0, over:false};
  const [m,s]=c.key.split("."), spent=sum(S.exps.filter(e=>!e.ex && e.mac===m && e.sub===s && e.date>=c.start && e.date<=to));
  return {days, span, total, spent, over: spent>c.limit, ok: spent<=c.limit && days>=Math.min(5,total)};
}

  const st=chalState(C.cur); C.hist=(C.hist||[]).concat([{label:C.cur.label, start:C.cur.start, ok:st.ok}]).slice(-20); if(st.ok) C.won=(C.won||0)+1; const lb=C.cur.label; C.cur=null; save();
  setTimeout(()=>toast((st.ok?"Sfida vinta: ":"Sfida non riuscita: ")+lb, st.ok), 300); }

/* ---------- i tuoi prezzi: voci a prezzo unitario stabile, ultimi 90 giorni contro oltre 6 mesi fa ---------- */
function priceWatch(){
  const td=today(), f0=firstDataYm(); if(!f0 || ymDiff(f0, ymOf(td))<6) return {ok:false};
  const rFrom=addDays(td,-90), oTo=addDays(td,-180), by={};
  S.exps.filter(e=>consumption(e) && !e.rec && e.note && e.mac).forEach(e=>{ const k=e.mac+"."+(e.sub||"")+"|"+norm(e.note); (by[k]=by[k]||[]).push(e); });
  const cv=a=>{ const m=a.reduce((t,v)=>t+v,0)/a.length; return m? Math.sqrt(a.reduce((t,v)=>t+(v-m)*(v-m),0)/a.length)/m : 1; };
  const rows=[]; Object.keys(by).forEach(k=>{ const es=by[k].sort((a,b)=>a.date<b.date?-1:1), rc=es.filter(e=>e.date>=rFrom).map(e=>e.amt), od=es.filter(e=>e.date<=oTo).slice(-10).map(e=>e.amt);
    if(rc.length<3 || od.length<3 || cv(rc)>0.25 || cv(od)>0.25) return;
    const a=median(od), b=median(rc), e=es[es.length-1]; rows.push({name:e.note, mac:e.mac, sub:e.sub, a, b, ch:b/a-1, n:rc.length}); });
  const w=rows.reduce((t,r)=>t+r.a*r.n,0), idx= w? rows.reduce((t,r)=>t+(r.b-r.a)*r.n,0)/w : null;
  return {ok:true, rows:rows.sort((x,y)=>Math.abs(y.ch)-Math.abs(x.ch)), idx};
}
function pricesHTML(){
  const P=priceWatch(); let b;
  if(!P.ok) b='<p class="hint">Servono almeno 6 mesi di storia per confrontare i prezzi.</p>';
  else if(!P.rows.length) b='<p class="hint">Nessuna voce a prezzo stabile da confrontare: servono almeno 3 acquisti uguali negli ultimi 90 giorni e 3 di oltre 6 mesi fa.</p>';
  else b='<p><b class="num">'+(P.idx>=0?"▲ +":"▼ ")+(Math.abs(P.idx)*100).toFixed(1).replace(".",",")+'%</b> <span class="hint">indice dei tuoi prezzi, su '+P.rows.length+(P.rows.length===1?' voce':' voci')+'</span></p><table class="mt">'+P.rows.slice(0,8).map(r=>'<tr><td>'+esc(r.name)+'<br><span class="mut">'+esc(subName(r.mac,r.sub)||macName(r.mac))+'</span></td><td>'+euro(r.a)+' → '+euro(r.b)+'<br>'+(r.ch>=0?"▲ +":"▼ ")+Math.round(Math.abs(r.ch)*100)+'%</td></tr>').join("")+'</table>';
  b+=details('Solo voci a prezzo unitario stabile: stessa sottocategoria e descrizione, almeno 3 acquisti negli ultimi 90 giorni e 3 di oltre 6 mesi fa, con variabilità entro il 25%. Si confrontano le mediane. L\'indice pesa ogni voce per quante volte l\'hai comprata negli ultimi 90 giorni.',"Come si calcola");
  return win("I tuoi prezzi","",b);
}

/* ---------- import dell'estratto conto (CSV): colonne scelte da te, doppioni saltati ---------- */
function decodeBuf(buf){ try{ return new TextDecoder("utf-8",{fatal:true}).decode(buf); }catch(e){ try{ return new TextDecoder("windows-1252").decode(buf); }catch(e2){ return new TextDecoder().decode(buf); } } }
function parseCSV(text){
  text=String(text).replace(/^﻿/,""); const first=text.split(/\r?\n/).find(l=>l.trim())||"";
  const cnt=ch=>{ let n=0,q=false; for(const c of first){ if(c==='"') q=!q; else if(c===ch && !q) n++; } return n; };
  const del=[";","\t",","].sort((a,b)=>cnt(b)-cnt(a))[0], rows=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; continue; }
    if(c==='"') q=true; else if(c===del){ row.push(f.trim()); f=""; }
    else if(c==="\n"||c==="\r"){ if(c==="\r" && text[i+1]==="\n") i++; row.push(f.trim()); f=""; if(row.some(x=>x!=="")) rows.push(row); row=[]; }
    else f+=c; }
  row.push(f.trim()); if(row.some(x=>x!=="")) rows.push(row);
  return {rows, del};
}
function parseDateAny(s){ s=String(s||"").trim(); let m, y, mo, d;
  if((m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s))){ y=+m[1]; mo=+m[2]; d=+m[3]; }
  else if((m=/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4}|\d{2})(?!\d)/.exec(s))){ d=+m[1]; mo=+m[2]; y=+m[3]; if(y<100) y+=2000; }
  else return null;
  return (mo>=1 && mo<=12 && d>=1 && d<=daysIn(y+"-"+pad(mo))) ? y+"-"+pad(mo)+"-"+pad(d) : null; }
function parseAmtAny(s){ s=String(s||"").replace(/[€\s ]/g,"").replace(/eur/i,""); if(!s) return null;
  const neg=/^-/.test(s)||/-$/.test(s)||/^\(.*\)$/.test(s); s=s.replace(/[()+\-]/g,""); if(!/^[\d.,]+$/.test(s)) return null;
  const lc=s.lastIndexOf(","), ld=s.lastIndexOf(".");
  if(lc>=0 && ld>=0) s= lc>ld ? s.replace(/\./g,"").replace(",",".") : s.replace(/,/g,"");
  else if(lc>=0) s=s.replace(/\./g,"").replace(",",".");
  else if(ld>=0 && /\.\d{3}$/.test(s)) s=s.replace(/\./g,"");      // 1.234 = migliaia
  const v=parseFloat(s); return isFinite(v)? Math.round(v*100)*(neg?-1:1) : null; }
let CI=null;
function openCsvImport(text,fname){
  const P=parseCSV(text); if(P.rows.length<2){ toast("Il file non sembra un CSV con movimenti"); return; }
  const hdr=P.rows[0], head=hdr.some(x=>/[a-z]/i.test(x)) && !hdr.some(x=>parseDateAny(x)), body=head? P.rows.slice(1) : P.rows;
  const cols=hdr.map((x,i)=>head && x? x : "Colonna "+(i+1)), g=re=> head? hdr.findIndex(x=>re.test(norm(x))) : -1;
  CI={fname, rows:body, cols, cDate:g(/data|date|valuta|contab/), cAmt:g(/importo|amount|euro/), cOut:g(/\bdare\b|uscit|addebit|debit/), cIn:g(/\bavere\b|entrat|accredit|credit/), cDesc:g(/descr|causale|operaz|dettagl|motivo|benefic/), inv:false};
  const sample=body.slice(0,6), every=(i,fn)=>sample.length && sample.every(r=>fn(r[i]));
  if(CI.cDate<0) CI.cDate=cols.findIndex((_,i)=>every(i,parseDateAny));
  if(CI.cAmt<0 && CI.cOut<0 && CI.cIn<0) CI.cAmt=cols.findIndex((_,i)=>i!==CI.cDate && every(i,v=>parseAmtAny(v)!==null));
  CI.mode= CI.cAmt>=0? "one" : (CI.cOut>=0||CI.cIn>=0)? "two" : "one";
  if(CI.cDesc<0) CI.cDesc=cols.findIndex((_,i)=>i!==CI.cDate && i!==CI.cAmt && sample.some(r=>/[a-z]{3}/i.test(r[i]||"")));
  drawCsv(); showSheet();
}
function csvItems(){
  const have=S.exps.map(e=>({d:e.date,a:e.amt,dir:"out"})).concat((S.ins||[]).map(e=>({d:e.date,a:e.amt,dir:"in"})));
  return CI.rows.map(r=>{ const d=parseDateAny(r[CI.cDate]); let a=null, dir="out";
    if(CI.mode==="one"){ const v=parseAmtAny(r[CI.cAmt]); if(v){ const s=CI.inv? -v : v; a=Math.abs(s); dir= s<0? "out" : "in"; } }
    else { const o=CI.cOut>=0? parseAmtAny(r[CI.cOut]) : null, i2=CI.cIn>=0? parseAmtAny(r[CI.cIn]) : null; if(o){ a=Math.abs(o); dir="out"; } else if(i2){ a=Math.abs(i2); dir="in"; } }
    const desc=String(CI.cDesc>=0? r[CI.cDesc]||"" : "").replace(/\s+/g," ").trim().slice(0,80);
    if(!d || !a) return {ok:false};
    return {ok:true, d, a, dir, desc, dup: have.some(x=>x.dir===dir && x.a===a && Math.abs(dayDiff(x.d,d))<=1)}; });
}

function download(name,text,type){

    const d=F.date; if(save()) askPersist(); closeSheet(); haptic(14); ui.ym=ymOf(d); render(); toast(msg); glitch(document.querySelector(".hud .big")); afterSave(); return; }
  if(!F.mac){ const g=$("macStrip"); g.classList.remove("need"); void g.offsetWidth; g.classList.add("need"); haptic(30); toast("Scegli almeno la categoria"); return; }

  } else if(!F.id){ S.exps.push({id:uid(),amt:c,mac:F.mac,sub:F.sub,date:F.date,note,ts:Date.now()}); msg=euro(c)+" in "+macName(F.mac)+(F.sub?" → "+subName(F.mac,F.sub):" (sottocategoria da verificare)"); }

/* foglio ricorrenza */
let Rr=null;
function openRecSheet(id){ const r=(S.recs||[]).find(x=>x.id===id); if(!r) return; Rr={id, amt:(r.amt/100).toFixed(2).replace(".",",").replace(/,00$/,""), mac:r.mac||"", sub:r.sub||"", kind:r.kind||"stip", note:r.note||"", freq:r.freq, arm:false}; drawRecSheet(); showSheet(); }
function drawRecSheet(){
  const r=S.recs.find(x=>x.id===Rr.id), inc=r.dir==="in", past=(inc?S.ins:S.exps).filter(e=>e.rec===r.id), nx=recActive(r)?nextOcc(r):null;

  h+='<p class="hint num">'+(recActive(r)? (nx?'Prossima: <b style="color:var(--fg)">'+esc(cap(dateObj(nx).toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"})))+'</b>':'') : 'Interrotta dal '+esc(shortDate(r.end)))+' · Registrata '+past.length+' volte, '+euro(sum(past))+' in tutto'+(PER_YEAR[r.freq]!==12?' · '+euro0(monthlyEq(r))+' al mese in costo equivalente':'')+'.</p>';
  h+='<div class="field"><label for="rNote">Descrizione</label><input type="text" id="rNote" maxlength="80" value="'+esc(Rr.note)+'"></div>';
  h+='<div class="field"><label for="rAmt">Importo €</label><input type="text" inputmode="decimal" id="rAmt" value="'+esc(Rr.amt)+'"></div>';
  if(inc) h+='<div class="field"><label for="rKind">Tipo di entrata</label><select id="rKind">'+Object.keys(INK).map(k=>'<option value="'+k+'"'+(k===Rr.kind?" selected":"")+'>'+esc(INK[k])+'</option>').join("")+'</select></div>';
  else h+='<div class="btns"><div class="field"><label for="rMac">Categoria</label><select id="rMac"><option value="">Da verificare</option>'+TAX.map(t=>'<option value="'+t.id+'"'+(t.id===Rr.mac?" selected":"")+'>'+esc(t.name)+'</option>').join("")+'</select></div><div class="field"><label for="rSub">Sottocategoria</label><select id="rSub"><option value="">Da verificare</option>'+(Rr.mac?TAXM[Rr.mac].subs.map(([k,n])=>'<option value="'+k+'"'+(k===Rr.sub?" selected":"")+'>'+esc(n)+'</option>').join(""):"")+'</select></div></div>';
  h+='<div class="strip" role="group" aria-label="Frequenza">'+Object.keys(FREQ).map(f=>'<button class="chip" data-f="'+f+'" aria-pressed="'+(Rr.freq===f)+'">'+FREQ[f].replace("Ogni ","")+'</button>').join("")+'</div>';
  h+='<p class="hint">Le modifiche valgono per le prossime volte; le spese già registrate restano come sono.</p><button class="btn primary" id="rSave">Salva modifiche</button>';
  if(recActive(r)) h+='<button class="btn" id="rStop">Interrompi da oggi (tieni lo storico)</button>';
  h+='<button class="btn danger'+(Rr.arm?" arm":"")+'" id="rDel">'+(Rr.arm?"Tocca ancora: elimina anche le "+past.length+" spese":"Elimina ricorrenza e le sue spese")+'</button></div>';
  const sh=$("sheet"); sh.innerHTML=h; sh.classList.remove("typing");
  const keep=()=>{ Rr.note=$("rNote").value; Rr.amt=$("rAmt").value; if(inc) Rr.kind=$("rKind").value; else { Rr.mac=$("rMac").value; Rr.sub=$("rSub").value; } };
  $("shClose").onclick=closeSheet;
  if(!inc) $("rMac").onchange=()=>{ keep(); Rr.sub=""; drawRecSheet(); };
  sh.querySelectorAll("[data-f]").forEach(b=>{ b.onclick=()=>{ keep(); Rr.freq=b.getAttribute("data-f"); drawRecSheet(); }; });
  $("rSave").onclick=()=>{ keep(); const c=cents(String(Rr.amt).replace(".",",")); if(!c){ toast("Inserisci un importo"); return; }
    if(Rr.freq!==r.freq) r.start = nextOcc(r) || today();
    r.amt=c; if(inc) r.kind=Rr.kind; else { r.mac=Rr.mac||null; r.sub=Rr.sub||null; } r.note=Rr.note.trim(); r.freq=Rr.freq; save(); closeSheet(); render(); toast("Ricorrenza aggiornata"); };
  const st=$("rStop"); if(st) st.onclick=()=>{ r.end=today(); save(); closeSheet(); render(); toast("Ricorrenza interrotta: le spese passate restano"); };
  $("rDel").onclick=()=>{ if(!Rr.arm){ keep(); Rr.arm=true; drawRecSheet(); return; } if(inc) S.ins=S.ins.filter(e=>e.rec!==r.id); else S.exps=S.exps.filter(e=>e.rec!==r.id); S.recs=S.recs.filter(x=>x.id!==r.id); save(); closeSheet(); render(); toast("Ricorrenza eliminata"); };
}

/* elenco delle spese da verificare */
function openCheckSheet(){

  const el=$("mig"); el.innerHTML=h; el.hidden=false;

}
